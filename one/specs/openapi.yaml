  # ------------------------------------------------------- P2 mesure produit
  /v1/telemetry/events:
    post:
      operationId: recordProductEvent
      summary: Enregistrer un événement d'usage
      description: |
        Mesure produit (CR-P2-01). Un événement de la liste blanche FERMÉE `ProductEventName`,
        avec des propriétés bornées (énumérations, entiers) : aucun texte libre, aucun
        identifiant de personne, aucun champ inconnu (422 VAL-01). `session_id` est exactement
        16 octets tirés au hasard par le navigateur, en 32 caractères hexadécimaux minuscules
        (CR-P2-02), jamais un identifiant d'utilisateur, d'adhérent, d'organisation ni un
        numéro ; il est validé puis écarté (ni stocké, ni dérivé). Le contributeur compté est
        la PERSONNE : le serveur stocke une empreinte HMAC de l'utilisateur du jeton, avec une
        clé du serveur (hors base, hors dépôt) ; rien de ce que le client envoie n'y entre.
        L'organisation et l'heure viennent du serveur.
        `role` doit être un rôle de l'utilisateur du jeton (sinon 403 AUTH-02) et correspondre
        à `surface` (console : gestionnaire, médecin-conseil, admin, employeur, et en P3
        assureur et administrateur de plateforme ; comptoir : clinique ; espace adhérent :
        adhérent). Rien ne sort de l'instance ; rétention
        configurable, puis purge.

        Propriétés admises par événement (toute autre est refusée, 422) :
        - `onboarding_started` : toutes surfaces ;
        - `onboarding_completed` : toutes surfaces, `duration_ms` facultatif (durée de
          l'accueil, 3 600 000 au plus) ;
        - `onboarding_step` : toutes surfaces, `step` obligatoire ;
        - `card_presented` : espace adhérent, `variant` en_ligne ou hors_ligne ;
        - `counter_decision_shown` : comptoir, `variant` accordee, revue ou refusee,
          `duration_ms` obligatoire (scan → écran de décision, objectif < 10 s, 300 000 au
          plus) ;
        - `payment_link_created` : espace adhérent, console ;
        - `palette_opened` : console, `variant` clavier ou bouton ;
        - `joe_question_asked` : console, `variant` exemple ou saisie (jamais la question) ;
        - `notification_opened` : toutes surfaces, `variant` sms, whatsapp ou in_app ;
        - `offline_banner_seen` : comptoir, espace adhérent ;
        - `claim_tracking_viewed` : espace adhérent.
        `duration_ms` est refusé (422) sur tout autre événement, même à 0.
      tags: [mesure]
      x-lot: P2
      x-roles: [gestionnaire, medecin_conseil, clinique, employeur, admin, adherent, assureur, admin_plateforme]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductEventRequest'}
      responses:
        '204':
          description: Événement enregistré.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/metrics/product:
    get:
      operationId: getProductMetrics
      summary: Indicateurs produit de l'organisation
      description: |
        Agrégats calculés à la demande depuis les tables de l'organisation du jeton : dossiers
        (`claims`, `claim_decisions`), événements d'usage non expirés (`product_events`), liens
        de paiement, grand livre, événements `contribution.received`. Taux en points de base
        (entiers, 10 000 = 100 %), durées en millisecondes (médiane discrète ; pour les écrans,
        médiane par personne puis médiane des personnes), écart du grand livre en francs CFA.
        Aucune donnée médicale, aucun identifiant.

        Période (CR-P2-02) : jours locaux demandés (366 au plus ; par défaut les 30 derniers),
        ÉLARGIE aux semaines civiles entières (lundi → dimanche, fuseau de l'organisation) puis
        COUPÉE à la dernière semaine terminée ; `period_from` et `period_to` rendent la période
        réellement publiée. Aucune semaine terminée : 422 VAL-01. Rien de postérieur à la fin
        de la période n'y entre (décision, paiement, réception), et les événements d'usage ne
        sont comptés que sur des semaines dont aucun n'a pu expirer, postérieures à la dernière
        rotation de la clé de pseudonymisation.

        k-anonymat : un indicateur est `masque` (ni valeur ni effectif) si moins de 5
        contributeurs le portent sur la période OU sur une semaine non vide de la période
        (deux périodes publiées ne diffèrent que de semaines qui passent chacune le seuil).
        Contributeurs : personnes distinctes (événements d'usage), bénéficiaires (dossiers),
        adhérents (liens, cotisations), écritures (grand livre).
      tags: [mesure]
      x-lot: P2
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Indicateurs de la période.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductMetrics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  # ------------------------------------------------------- P3 marque blanche
  /v1/public/branding:
    get:
      operationId: getOrganizationBranding
      summary: Marque publique d'une organisation
      description: |
        Marque blanche (CR-P3-01), lue SANS jeton avant la connexion, par identifiant public
        (`slug`) OU par domaine personnalisé (`domain`), exactement l'un des deux (sinon 422).
        Champs non sensibles seulement : nom affiché, logo, surcharges de jetons (liste fermée,
        thèmes clair et sombre), pays, devise, domaine et textes légaux. Aucun identifiant
        interne, aucun utilisateur, aucune donnée métier. Seules les organisations `active` sont
        servies : inconnue, en intégration ou inactive donnent le MÊME 404 NOT-01 (aucun oracle,
        CR-P3-02). Par domaine : seulement un domaine PROUVÉ (`verifyBrandingDomain`) ; un
        domaine en attente de vérification n'est ni résolu ni renvoyé (`custom_domain` null).
        Sans réglage, `display_name` est le nom de l'organisation et `theme` est vide (jetons du
        contrat de design).
      tags: [marque-blanche]
      x-lot: P3
      x-roles: [public]
      security: []
      parameters:
        - name: slug
          in: query
          description: Identifiant public de l'organisation (exclusif avec `domain`).
          schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
        - name: domain
          in: query
          description: Domaine personnalisé PROUVÉ par l'organisation (exclusif avec `slug`).
          schema: {type: string, minLength: 4, maxLength: 253}
      responses:
        '200':
          description: Marque publique.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationBranding'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/organization/branding:
    get:
      operationId: getBrandingSettings
      summary: Réglages de marque de l'organisation
      description: Réglages de marque blanche de l'organisation du jeton, pour l'écran d'administration.
      tags: [marque-blanche]
      x-lot: P3
      x-roles: [admin]
      responses:
        '200':
          description: Réglages de marque.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrandingSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: updateBrandingSettings
      summary: Régler la marque de l'organisation
      description: |
        Remplace les réglages de marque de l'organisation du jeton (admin d'organisation
        seulement ; journalisé `organization.branding_updated`). Gardes, dans l'ordre :
        - liste FERMÉE de jetons (`BrandTokenOverrides`), thèmes clair et sombre seulement, valeurs
          `#RRGGBB` : toute autre clé, tout CSS libre, le plein soleil : 422 BRD-02 ;
        - contraste calculé côté serveur sur chaque paire du contrat de design qui touche un jeton
          surchargé (texte 4,5:1, focus 3:1, WCAG AA), en clair ET en sombre ; un accent égal à
          une couleur de statut est refusé : 422 BRD-01, chaque paire en défaut dans `errors`
          (thème, paire, rapport) ;
        - logo non exécutable : chemin interne, `https` vers un hôte de la liste DÉDIÉE des hôtes
          de logo de l'instance (jamais la liste blanche réseau du serveur : HealthOS, bases), ou
          data-URI PNG/WebP/JPEG (signature vérifiée) ou SVG assaini (liste blanche d'éléments et
          d'attributs, éléments actifs refusés nommément, seule déclaration admise
          `<?xml version="1.0" encoding="UTF-8"?>`, aucune référence externe), 32 Ko au plus :
          sinon 422 BRD-03 ;
        - domaine personnalisé réservé (nom à usage spécial : `localhost`, `.invalid`, `.local`,
          `.internal`… ; domaines de la plateforme ; hôtes de l'instance — lien de paiement,
          HealthOS — et leurs zones parentes, sous-domaines compris) : 422 BRD-05 (CR-P3-02) ;
        - domaine personnalisé déjà déclaré par une autre organisation : 409 BRD-04.
        Un domaine nouveau ou changé est `en_attente_de_verification` (nouveau jeton, preuve
        effacée) et n'est pas servi tant que `verifyBrandingDomain` n'a pas abouti ; le même
        domaine réenregistré garde sa preuve.
      tags: [marque-blanche]
      x-lot: P3
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateBrandingRequest'}
      responses:
        '200':
          description: Réglages enregistrés.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrandingSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/organization/branding/domain-verification:
    post:
      operationId: verifyBrandingDomain
      summary: Prouver la propriété du domaine personnalisé
      description: |
        CR-P3-02. Vérifie que l'organisation du jeton contrôle le domaine déclaré : un
        enregistrement DNS TXT `custom_domain_verification.record_name` doit porter exactement
        `custom_domain_verification.record_value` (jeton tiré par le serveur, propre au domaine
        déclaré). Succès : `custom_domain_status` = `verifie`, le domaine devient résoluble par
        `getOrganizationBranding` ; journalisé `organization.custom_domain_verified`. Sans
        domaine déclaré, ou enregistrement absent ou différent : 422 BRD-06 (rien ne change).
        Domaine devenu réservé : 422 BRD-05. Idempotent : un domaine déjà prouvé est renvoyé tel
        quel. La résolution DNS passe par un port de l'instance (sans résolveur configuré, aucune
        preuve n'aboutit et le domaine personnalisé reste désactivé ; le `slug` reste utilisable).
      tags: [marque-blanche]
      x-lot: P3
      x-roles: [admin]
      responses:
        '200':
          description: Réglages de marque, domaine prouvé.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrandingSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  # ------------------------------------------------------- P3 espace assureur
  /v1/insurer/portfolio:
    get:
      operationId: getInsurerPortfolio
      summary: Portefeuille agrégé de l'organisation
      description: |
        Espace assureur (CR-P3-01), lecture seule. Agrégats de l'organisation du jeton sur la
        période (jours locaux inclus, 366 au plus, 30 derniers jours par défaut) : adhérents par
        statut, primes encaissées, sinistres (part mutuelle des dossiers accordés), ratio
        sinistres/primes (S/P, points de base), prestations par catégorie de garantie (jamais
        d'acte ni de motif), principaux prestataires, délai moyen de décision, part
        d'automatisation. k-anonymat : une cellule portée par moins de 5 personnes est `masque` ;
        les catégories et prestataires sous le seuil sont fondus dans `autres`, et des cellules
        voisines sont masquées si besoin pour qu'aucune soustraction ne révèle moins de 5
        personnes. Aucun nom, aucun identifiant de personne.
        Anti-recoupement (CR-P3-02, même méthode que `getProductMetrics`) : la période demandée
        est élargie aux semaines civiles entières (lundi → dimanche, fuseau de l'organisation) et
        coupée à la dernière semaine TERMINÉE (`period_from`/`period_to` rendent la période
        publiée ; la semaine en cours et le futur ne le sont jamais ; aucune semaine terminée :
        422 VAL-01) ; une valeur est aussi masquée si UNE semaine non vide de la période a moins
        de 5 personnes ; rien de postérieur à la fin de la période n'y entre (décision prise
        après, statut d'adhérent pris à la fin de la période). Jamais de valeur exacte :
        comptes (adhérents, dossiers) publiés comme `contributors`, au plancher du palier (5, 10,
        20, 50, 100), montants arrondis au millier de francs CFA ; taux et délai tels quels.
      tags: [espace-assureur]
      x-lot: P3
      x-roles: [assureur, admin]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Portefeuille agrégé.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InsurerPortfolio'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/insurer/portfolio/export:
    get:
      operationId: exportInsurerPortfolio
      summary: Exporter le portefeuille agrégé (CSV)
      description: |
        Mêmes agrégats et mêmes masques que `getInsurerPortfolio`, en CSV UTF-8 (séparateur `;`,
        colonnes `section;cle;statut;valeur;effectif;unite`). Une cellule masquée a `valeur` et
        `effectif` vides ; comptes et effectifs par palier, montants au millier (aucune valeur
        exacte). Toute cellule de texte qui commencerait, après d'éventuels espaces, par `=`, `+`,
        `-`, `@`, une tabulation, un retour chariot, un saut de ligne ou leur forme pleine chasse
        est préfixée d'une apostrophe (injection de formule). Journalisé
        `insurer.portfolio_exported`.
      tags: [espace-assureur]
      x-lot: P3
      x-roles: [assureur, admin]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Fichier CSV agrégé.
          content:
            text/csv:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  # ------------------------------------------------------- P3 espace employeur
  /v1/employer/consumption:
    get:
      operationId: getEmployerConsumption
      summary: Consommation agrégée du groupe
      description: |
        Espace employeur (CR-P3-01) : pour chaque groupe de la portée du jeton (attribut
        `employer_id` du rôle employeur), adhérents par statut, dossiers et part mutuelle par
        catégorie de garantie, sur la période. Agrégats k-anonymes (même règle que l'espace
        assureur, y compris semaines entières et terminées, seuil par semaine, comptes par
        palier et montants au millier — CR-P3-02) ; aucun nom de salarié, aucun identifiant de
        personne, aucun dossier.
      tags: [espace-employeur]
      x-lot: P3
      x-roles: [employeur]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Consommation agrégée.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmployerConsumption'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/employer/contracts:
    get:
      operationId: listEmployerContracts
      summary: Contrats de groupe et échéances
      description: |
        Contrats de groupe de la portée du jeton, avec leur échéance : `a_echeance` si la fin du
        contrat tombe dans les `within_days` jours (90 par défaut), `echu` si elle est passée.
        Effectif du groupe k-anonyme, par palier, pris à la fin de la dernière semaine terminée
        (jamais « en direct », CR-P3-02) ; aucun nom de salarié.
      tags: [espace-employeur]
      x-lot: P3
      x-roles: [employeur]
      parameters:
        - name: within_days
          in: query
          description: Horizon d'échéance, en jours.
          schema: {type: integer, minimum: 1, maximum: 365, default: 90}
      responses:
        '200':
          description: Contrats de groupe.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmployerContractList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  # ------------------------------------------------------- P3 plateforme
  /v1/platform/organizations:
    post:
      operationId: createOrganization
      summary: Accueillir une organisation
      description: |
        Administrateur de plateforme seulement (rôle `admin_plateforme`, dans une organisation
        de capacité `plateforme` ; vérifié par la base en plus de la matrice). Crée
        l'organisation (statut `integration`, jamais « plateforme »), invite son premier
        gestionnaire (rôles `gestionnaire` et `admin` de la NOUVELLE organisation) et copie le
        gabarit de configuration demandé (pays identique) en NOUVELLES lignes : plan de comptes,
        règles et produits en version 1 `brouillon` à publier par l'organisation, actes et
        barème en vigueur à la date du jour. Aucune ligne n'est partagée entre organisations.
        Journalisé dans les deux organisations (`organization.created`,
        `organization.onboarded`). Tout ou rien : une erreur n'en laisse aucune trace.
        Identifiant public déjà pris : 409 ORG-01 ; gabarit inconnu ou d'un autre pays : 422
        ORG-02.
      tags: [plateforme]
      x-lot: P3
      x-roles: [admin_plateforme]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrganizationRequest'}
      responses:
        '201':
          description: Organisation accueillie.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationOnboarding'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/platform/configuration-templates:
    get:
      operationId: listConfigurationTemplates
      summary: Gabarits de configuration
      description: Gabarits de l'organisation « plateforme » du jeton, toutes versions.
      tags: [plateforme]
      x-lot: P3
      x-roles: [admin_plateforme]
      responses:
        '200':
          description: Gabarits.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigurationTemplateList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createConfigurationTemplate
      summary: Publier une version de gabarit
      description: |
        Instantané, à la date du jour, de la configuration EN VIGUEUR de l'organisation
        « plateforme » du jeton : plan de comptes, règles (paramètres de la version en vigueur),
        produits (version en vigueur et garanties), actes et barème. Nouvelle version du code
        (1, 2…), figée (en ajout seul). Aucune donnée de personne. Rien en vigueur : 422 VAL-01.
        Journalisé `configuration_template.created`.
      tags: [plateforme]
      x-lot: P3
      x-roles: [admin_plateforme]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateConfigurationTemplateRequest'}
      responses:
        '201':
          description: Version de gabarit publiée.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigurationTemplate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton du fournisseur d'identité (non choisi, PRD §10 Q2). Porte l'organisation et les rôles.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: Signature HMAC du corps par le canal de paiement (secret par canal, hors code).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clé unique par commande (8 à 200 caractères). Rejouer la même clé renvoie la même réponse ; un corps différent donne 409 IDEM-01.
      schema: {type: string, minLength: 8, maxLength: 200}
    Cursor:
      name: cursor
      in: query
      description: Curseur opaque renvoyé par la page précédente.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: Taille de page.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    From:
      name: from
      in: query
      description: Début de période (inclus).
      schema: {type: string, format: date}
    To:
      name: to
      in: query
      description: Fin de période (incluse).
      schema: {type: string, format: date}
    AtDate:
      name: at
      in: query
      description: Date d'évaluation ; par défaut aujourd'hui (heure locale de l'instance).
      schema: {type: string, format: date}
    ActId:
      name: act_id
      in: path
      required: true
      description: Identifiant de l'acte.
      schema: {type: string, format: uuid}
    UserId:
      name: user_id
      in: path
      required: true
      description: Identifiant de l'utilisateur.
      schema: {type: string, format: uuid}
    PlanId:
      name: plan_id
      in: path
      required: true
      description: Identifiant du produit.
      schema: {type: string, format: uuid}
    PlanVersionId:
      name: plan_version_id
      in: path
      required: true
      description: Identifiant de la version de produit.
      schema: {type: string, format: uuid}
    RuleCode:
      name: rule_code
      in: path
      required: true
      description: Code stable de la règle.
      schema: {$ref: '#/components/schemas/RuleCodeValue'}
    RuleVersionId:
      name: rule_version_id
      in: path
      required: true
      description: Identifiant de la version de règle.
      schema: {type: string, format: uuid}
    ProviderId:
      name: provider_id
      in: path
      required: true
      description: Identifiant du prestataire.
      schema: {type: string, format: uuid}
    EntryId:
      name: entry_id
      in: path
      required: true
      description: Identifiant de l'écriture.
      schema: {type: string, format: uuid}
    MemberId:
      name: member_id
      in: path
      required: true
      description: Identifiant de l'adhérent.
      schema: {type: string, format: uuid}
    ContributionId:
      name: contribution_id
      in: path
      required: true
      description: Identifiant de la cotisation.
      schema: {type: string, format: uuid}
    PaymentToken:
      name: token
      in: path
      required: true
      description: Jeton du lien de paiement.
      schema: {type: string, minLength: 32, maxLength: 128}
    IdentificationId:
      name: identification_id
      in: path
      required: true
      description: Identifiant de l'identification au comptoir.
      schema: {type: string, format: uuid}
    ClaimId:
      name: claim_id
      in: path
      required: true
      description: Identifiant du dossier.
      schema: {type: string, format: uuid}

  responses:
    Unauthorized:
      description: Non authentifié (AUTH-01) ou signature de webhook invalide (PAY-01).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            code: AUTH-01
            message: Votre session a expiré.
            action: Reconnectez-vous puis recommencez.
            request_id: req_01J9Z6
    Forbidden:
      description: Rôle insuffisant (AUTH-02) ou motif médical réservé au médecin-conseil (SEC-01).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            code: SEC-01
            message: Le motif médical est réservé au médecin-conseil.
            action: Demandez l'avis du médecin-conseil depuis le dossier.
            request_id: req_01J9Z7
    NotFound:
      description: Introuvable ou hors de votre périmètre (NOT-01, ID-06). On ne distingue pas les deux.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            code: ID-06
            message: Aucune carte active ne correspond à ce code.
            action: Vérifiez le numéro sur la carte ou demandez une nouvelle carte à la mutuelle.
            request_id: req_01J9Z8
    Conflict:
      description: État incompatible (CLM-01, MBR-01, LED-01, RUL-01, RUL-02, IDEM-01, IDEM-02, PAY-02, BRD-04, ORG-01).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            code: LED-01
            message: Cette écriture a déjà été contre-passée.
            action: Consultez l'écriture de contre-passation liée.
            request_id: req_01J9Z9
    ValidationError:
      description: Données invalides (VAL-01), code SMS faux (ID-03), acte hors barème (CLM-02), marque refusée (BRD-01, BRD-02, BRD-03), gabarit inconnu (ORG-02).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            code: ID-03
            message: Code incorrect. Il reste 2 essais.
            action: Demandez à l'adhérent de relire le SMS, ou renvoyez le code.
            remaining_attempts: 2
            request_id: req_01J9ZA
    Gone:
      description: Code SMS expiré (ID-05) ou lien de paiement expiré ou déjà utilisé (PAY-03).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            code: PAY-03
            message: Ce lien de paiement a expiré.
            action: Demandez un nouveau lien à l'adhérent ou à la mutuelle.
            request_id: req_01J9ZB
    Locked:
      description: Carte bloquée après trop de codes faux (ID-04).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            code: ID-04
            message: Carte bloquée pendant 15 minutes après 3 codes faux.
            action: Faites patienter l'adhérent ou contactez la mutuelle.
            retry_after_seconds: 900
            request_id: req_01J9ZC
    UpstreamUnavailable:
      description: HealthOS indisponible (INT-01).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            code: INT-01
            message: Le dossier médical est momentanément indisponible.
            action: Réessayez dans quelques minutes.
            request_id: req_01J9ZD

  schemas:
    # ---------------------------------------------------------- communs
    ErrorCode:
      type: string
      description: |
        Codes stables. Motifs de règle : R-01 droits suspendus ou non ouverts, R-04 hors réseau
        ou hors barème, R-07 carence en cours, R-09 plafond insuffisant, R-12 accord automatique,
        R-20 revue médecin-conseil. Identification : ID-02 identité refusée, ID-03 code faux,
        ID-04 carte bloquée, ID-05 code expiré, ID-06 carte inconnue ou révoquée, ID-07
        identification incomplète. Hors ligne : OFF-01 expiré, OFF-02 signature invalide,
        OFF-03 au-dessus du seuil, OFF-04 appareil révoqué. Autres : AUTH-01 non authentifié,
        AUTH-02 rôle insuffisant, SEC-01 motif médical réservé, VAL-01 données invalides,
        NOT-01 introuvable, IDEM-01 clé réutilisée avec un autre contenu, IDEM-02 requête en
        cours, CLM-01 transition interdite, CLM-02 acte hors barème, MBR-01 changement de statut
        d'adhérent impossible, RUL-01 version publiée
        figée, RUL-02 chevauchement de versions, LED-01 déjà contre-passée, PAY-01 signature
        invalide, PAY-02 montant différent, PAY-03 lien expiré ou utilisé, INT-01 HealthOS
        indisponible, SYS-01 erreur interne. Marque blanche et plateforme (P3) : BRD-01
        contraste insuffisant (WCAG AA) ou accent pris à un statut, BRD-02 jeton hors liste
        fermée ou couleur hors format, BRD-03 logo refusé (exécutable ou hors liste blanche),
        BRD-04 domaine déjà déclaré, BRD-05 domaine réservé (plateforme, instance, usage
        spécial), BRD-06 propriété du domaine non prouvée (enregistrement DNS TXT absent),
        ORG-01 identifiant public d'organisation déjà pris, ORG-02 gabarit de configuration
        inconnu ou d'un autre pays.
      enum:
        - R-01
        - R-04
        - R-07
        - R-09
        - R-12
        - R-20
        - ID-02
        - ID-03
        - ID-04
        - ID-05
        - ID-06
        - ID-07
        - OFF-01
        - OFF-02
        - OFF-03
        - OFF-04
        - AUTH-01
        - AUTH-02
        - SEC-01
        - VAL-01
        - NOT-01
        - IDEM-01
        - IDEM-02
        - CLM-01
        - CLM-02
        - MBR-01
        - RUL-01
        - RUL-02
        - LED-01
        - PAY-01
        - PAY-02
        - PAY-03
        - INT-01
        - SYS-01
        - BRD-01
        - BRD-02
        - BRD-03
        - BRD-04
        - BRD-05
        - BRD-06
        - ORG-01
        - ORG-02
    Problem:
      type: object
      description: Erreur métier. `message` et `action` sont en français simple, prêts à afficher.
      required: [code, message, action, request_id]
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message:
          type: string
          description: Ce qui s'est passé, en une phrase.
        action:
          type: string
          description: Ce que l'utilisateur doit faire.
        request_id:
          type: string
          description: Identifiant de la requête pour le support.
        remaining_attempts:
          type: integer
          minimum: 0
          description: Essais restants (ID-03).
        retry_after_seconds:
          type: integer
          minimum: 0
          description: Délai avant nouvel essai (ID-04).
        errors:
          type: array
          description: Détail par champ (VAL-01).
          items: {$ref: '#/components/schemas/FieldError'}
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: {type: string}
        message: {type: string}
    AmountXof:
      type: integer
      format: int64
      minimum: 0
      description: Montant en francs CFA, entier.
    Currency:
      type: string
      const: XOF
      description: Franc CFA UEMOA.
    PageInfo:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, 'null']
          description: Curseur de la page suivante ; null en fin de liste.
    Role:
      type: string
      description: |
        `assureur` (P3) lit les agrégats k-anonymes de son organisation ; `admin_plateforme` (P3)
        n'existe que dans une organisation « plateforme » et n'est jamais attribué par l'API.
      enum: [gestionnaire, medecin_conseil, clinique, employeur, admin, adherent, assureur, admin_plateforme]
    RuleCodeValue:
      type: string
      pattern: '^[A-Z]{1,3}-[0-9]{2}$'
      description: Code stable d'une règle (R-01, R-12, ID-03…).
    RuleRef:
      type: object
      description: Règle et version appliquées.
      required: [code, version]
      properties:
        code: {$ref: '#/components/schemas/RuleCodeValue'}
        version: {type: integer, minimum: 1}
    Source:
      type: object
      description: Enregistrement consulté.
      required: [type, id]
      properties:
        type:
          type: string
          enum: [member, claim, contribution, ledger_entry, plan_version, rule_version, provider, tariff_item]
        id: {type: string, format: uuid}
        label:
          type: string
          description: Libellé lisible (numéro de dossier, d'écriture…), sans donnée médicale.

    # ------------------------------------------------------------- L1
    CurrentUser:
      type: object
      required: [user, organization, roles]
      properties:
        user: {$ref: '#/components/schemas/User'}
        organization: {$ref: '#/components/schemas/Organization'}
        roles:
          type: array
          items: {$ref: '#/components/schemas/RoleGrant'}
    Organization:
      type: object
      required: [id, slug, name, country_code, timezone, currency, capabilities]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        slug: {type: string}
        name: {type: string}
        country_code: {type: string, enum: [CI, SN]}
        timezone: {type: string, enum: [Africa/Abidjan, Africa/Dakar]}
        currency: {$ref: '#/components/schemas/Currency'}
        capabilities:
          type: array
          items: {type: string, enum: [porteur_de_risque, gestionnaire, distributeur, plateforme]}
    RoleGrant:
      type: object
      required: [role]
      properties:
        role: {$ref: '#/components/schemas/Role'}
        provider_id:
          type: [string, 'null']
          format: uuid
          description: Obligatoire pour le rôle clinique.
        employer_id:
          type: [string, 'null']
          format: uuid
          description: Obligatoire pour le rôle employeur.
        member_id:
          type: [string, 'null']
          format: uuid
          description: Obligatoire pour le rôle adherent (son contrat), interdit sinon (P1).
    User:
      type: object
      required: [id, display_name, status, roles]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
        email: {type: [string, 'null'], format: email}
        status: {type: string, enum: [active, disabled]}
        roles:
          type: array
          items: {$ref: '#/components/schemas/RoleGrant'}
    UserList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/User'}
        page: {$ref: '#/components/schemas/PageInfo'}
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [idp_subject, display_name, roles]
      properties:
        idp_subject: {type: string, minLength: 1}
        display_name: {type: string, minLength: 1}
        email: {type: string, format: email}
        roles:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RoleGrant'}
    ReplaceUserRolesRequest:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          items: {$ref: '#/components/schemas/RoleGrant'}
    AuditEvent:
      type: object
      required: [id, occurred_at, action, target_type]
      properties:
