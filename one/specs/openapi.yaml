openapi: 3.1.0
info:
  title: MulemaCare One API
  version: 0.1.0
  summary: Noyau de gestion de la mutuelle MulemaCare (contrat L0).
  description: |
    Contrat d'API des lots L1 à L8 (specs/LOTS.md). Brouillon v0.1 du 2026-09-30, à relire par
    un humain. Toute modification passe par specs/CHANGE-REQUESTS.md.

    Principes :
    - L'organisation vient du jeton (JWT), jamais d'un paramètre ni d'un corps de requête.
      Seule exception : le webhook de paiement, non authentifié par jeton, qui porte le
      `organization_slug` dans son URL et est authentifié par signature.
    - Montants : entiers en francs CFA (`*_xof`, int64), devise explicite `XOF`.
    - Aucune donnée médicale dans les réponses, sauf `GET /v1/claims/{claim_id}/medical-reason`,
      réservé au médecin-conseil, lu à la demande chez HealthOS et journalisé.
    - Décisions de prise en charge : prises par le moteur de règles (code et version renvoyés)
      ou par un humain. JOE recommande et prépare ; il n'a aucune opération qui décide ou paie.
    - Erreurs : `application/problem+json`, `code` stable, `message` en français simple qui dit
      quoi faire. Les codes de règle (R-01, R-04…) servent aussi de motifs de décision.
    - `x-lot` indique le lot propriétaire de l'opération, `x-roles` les rôles autorisés.
      `x-lot: P1` = Phase 1, espace adhérent et diaspora (CR-P1-01, ajout strictement additif
      appliqué sur instruction de Dajan pour enchaîner la Phase 1 — à valider) : rôle `adherent`
      rattaché à SON contrat ; il ne voit que ses propres données.
      `x-lot: P2` = Phase 2, mesure produit (CR-P2-01, ajout strictement additif appliqué sur
      instruction de Dajan pour enchaîner les phases — à valider) : événements d'usage en liste
      blanche fermée, sans texte libre ni identifiant de personne, gardés dans la base de
      l'instance (aucun traceur tiers) ; agrégats réservés au gestionnaire et à l'admin, masqués
      sous 5 contributeurs (k-anonymat).
      `x-lot: P3` = Phase 3, marque blanche et espaces assureur, employeur et plateforme
      (CR-P3-01, ajout strictement additif appliqué sur instruction de Dajan pour enchaîner les
      phases — à valider ; vente clé en main aux assureurs décidée le 01/10, PRD §2 amendé) :
      marque par organisation (liste fermée de jetons, contraste WCAG AA vérifié par le
      serveur, logo non exécutable), agrégats k-anonymes pour l'assureur et l'employeur, accueil
      d'une organisation par copie de gabarit (aucune ligne partagée) par un administrateur de
      plateforme.
  contact:
    name: MulemaCare One — équipe noyau
    email: noyau@mulemacare.invalid
  license:
    name: Propriétaire
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000
    description: Développement local (make dev)
security:
  - bearerAuth: []
tags:
  - name: noyau
    description: Organisation, utilisateurs, rôles et journal d'audit (L1).
  - name: produits
    description: Produits versionnés, garanties, réseau et barème (L2).
  - name: regles
    description: Règles de décision stockées en données et simulation (L2).
  - name: grand-livre
    description: Écritures en partie double, contre-passation et balance (L3).
  - name: adherents
    description: Adhérents, ayants droit, droits et cartes (L4).
  - name: cotisations
    description: Cotisations, liens de paiement et webhooks (L4).
  - name: comptoir
    description: Identification en trois facteurs et mode hors ligne (L5).
  - name: prises-en-charge
    description: Demandes, décisions et motif médical à la demande (L5).
  - name: joe
    description: Assistant JOE — lecture et préparation uniquement (L8).
  - name: espace-adherent
    description: Espace adhérent et diaspora — ma carte, mes soins, mes cotisations (P1).
  - name: mesure
    description: Mesure produit — événements d'usage et agrégats k-anonymes, sans traceur tiers (P2).
  - name: marque-blanche
    description: Marque blanche par organisation — liste fermée de jetons, contraste AA vérifié (P3).
  - name: espace-assureur
    description: Espace assureur — portefeuille agrégé k-anonyme, lecture seule (P3).
  - name: espace-employeur
    description: Espace employeur — consommation agrégée du groupe, échéances, sans nom de salarié (P3).
  - name: plateforme
    description: Accueil d'organisation par copie de gabarit, réservé à l'administrateur de plateforme (P3).

paths:
  # ---------------------------------------------------------------- L1 noyau
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Utilisateur connecté
      description: Renvoie l'utilisateur du jeton, son organisation et ses rôles.
      tags: [noyau]
      x-lot: L1
      x-roles: [gestionnaire, medecin_conseil, clinique, employeur, admin, adherent, assureur, admin_plateforme]
      responses:
        '200':
          description: Utilisateur connecté.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/organization:
    get:
      operationId: getCurrentOrganization
      summary: Organisation de l'utilisateur
      description: Organisation déduite du jeton.
      tags: [noyau]
      x-lot: L1
      x-roles: [gestionnaire, medecin_conseil, clinique, employeur, admin, adherent, assureur, admin_plateforme]
      responses:
        '200':
          description: Organisation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/users:
    get:
      operationId: listUsers
      summary: Lister les utilisateurs
      description: Utilisateurs de l'organisation, avec leurs rôles.
      tags: [noyau]
      x-lot: L1
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page d'utilisateurs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createUser
      summary: Créer un utilisateur
      description: Rattache un sujet du fournisseur d'identité à l'organisation.
      tags: [noyau]
      x-lot: L1
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: Utilisateur créé.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/users/{user_id}/roles:
    put:
      operationId: replaceUserRoles
      summary: Remplacer les rôles d'un utilisateur
      description: Remplace l'ensemble des rôles (et attributs de portée) ; journalisé dans l'audit.
      tags: [noyau]
      x-lot: L1
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplaceUserRolesRequest'}
      responses:
        '200':
          description: Utilisateur avec ses nouveaux rôles.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/audit-events:
    get:
      operationId: listAuditEvents
      summary: Consulter le journal d'audit
      description: Journal immuable, filtré par action et cible. Aucune donnée médicale.
      tags: [noyau]
      x-lot: L1
      x-roles: [admin]
      parameters:
        - name: action
          in: query
          description: Action exacte, par exemple `claim.medical_reason.read`.
          schema: {type: string}
        - name: target_id
          in: query
          description: Identifiant de la cible.
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page d'événements d'audit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  # ------------------------------------------------------------ L2 produits
  /v1/plans:
    get:
      operationId: listPlans
      summary: Lister les produits
      description: Produits de l'organisation avec leur version en vigueur.
      tags: [produits]
      x-lot: L2
      x-roles: [gestionnaire, admin]
      responses:
        '200':
          description: Produits.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createPlan
      summary: Créer un produit
      description: Crée un produit sans version ; les paramètres vivent dans ses versions.
      tags: [produits]
      x-lot: L2
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePlanRequest'}
      responses:
        '201':
          description: Produit créé.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/plans/{plan_id}:
    get:
      operationId: getPlan
      summary: Détail d'un produit
      description: Produit et toutes ses versions (brouillon, soumise, en vigueur, clôturée).
      tags: [produits]
      x-lot: L2
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Produit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/plans/{plan_id}/versions:
    post:
      operationId: createPlanVersion
      summary: Créer une version de produit (brouillon)
      description: Nouvelle version avec date d'effet. Elle ne s'applique qu'aux soins datés à partir de cette date.
      tags: [produits]
      x-lot: L2
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePlanVersionRequest'}
      responses:
        '201':
          description: Version créée en brouillon.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanVersion'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/plan-versions/{plan_version_id}:
    get:
      operationId: getPlanVersion
      summary: Détail d'une version de produit
      description: Paramètres et garanties d'une version.
      tags: [produits]
      x-lot: L2
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/PlanVersionId'
      responses:
        '200':
          description: Version de produit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanVersion'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/plan-versions/{plan_version_id}/publication:
    post:
      operationId: publishPlanVersion
      summary: Publier une version de produit
      description: Passe la version en vigueur. Une version publiée est figée (RUL-01) et ne chevauche aucune autre (RUL-02).
      tags: [produits]
      x-lot: L2
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/PlanVersionId'
      responses:
        '200':
          description: Version publiée.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanVersion'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/providers:
    get:
      operationId: listProviders
      summary: Lister les prestataires
      description: Réseau de soins, avec l'état de convention à la date demandée.
      tags: [produits]
      x-lot: L2
      x-roles: [gestionnaire, medecin_conseil, admin]
      parameters:
        - $ref: '#/components/parameters/AtDate'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page de prestataires.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProviderList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createProvider
      summary: Créer un prestataire
      description: Ajoute un prestataire au réseau (non conventionné tant qu'aucune convention n'existe).
      tags: [produits]
      x-lot: L2
      x-roles: [gestionnaire, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProviderRequest'}
      responses:
        '201':
          description: Prestataire créé.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Provider'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/providers/{provider_id}:
    get:
      operationId: getProvider
      summary: Détail d'un prestataire
      description: Prestataire et historique de ses conventions.
      tags: [produits]
      x-lot: L2
      x-roles: [gestionnaire, medecin_conseil, admin]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '200':
          description: Prestataire.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Provider'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/providers/{provider_id}/conventions:
    post:
      operationId: createProviderConvention
      summary: Conventionner un prestataire
      description: Ouvre une période de convention (règle R-04).
      tags: [produits]
      x-lot: L2
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProviderConventionRequest'}
      responses:
        '201':
          description: Convention créée.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProviderConvention'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/tariffs:
    get:
      operationId: listTariffs
      summary: Barème conventionné
      description: Actes et montants du barème en vigueur à une date (par défaut aujourd'hui).
      tags: [produits]
      x-lot: L2
      x-roles: [gestionnaire, medecin_conseil, clinique, admin]
      parameters:
        - $ref: '#/components/parameters/AtDate'
      responses:
        '200':
          description: Barème.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TariffList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/acts:
    get:
      operationId: listActs
      summary: Nomenclature des actes
      description: Actes facturables (libellés de facturation, aucun motif médical).
      tags: [produits]
      x-lot: L2
      x-roles: [gestionnaire, medecin_conseil, admin]
      responses:
        '200':
          description: Actes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createAct
      summary: Créer un acte
      description: Ajoute un acte à la nomenclature, rattaché à une catégorie de garantie.
      tags: [produits]
      x-lot: L2
      x-roles: [gestionnaire, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateActRequest'}
      responses:
        '201':
          description: Acte créé.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Act'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/acts/{act_id}/tariffs:
    post:
      operationId: createTariffItem
      summary: Tarifer un acte
      description: Ajoute un montant de barème daté pour un acte (règle R-04, barème de l'année du soin).
      tags: [produits]
      x-lot: L2
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/ActId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTariffItemRequest'}
      responses:
        '201':
          description: Ligne de barème créée.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TariffItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  # -------------------------------------------------------------- L2 règles
  /v1/rules:
    get:
      operationId: listRules
      summary: Lister les règles
      description: Règles de décision avec leur version en vigueur et ses paramètres.
      tags: [regles]
      x-lot: L2
      x-roles: [gestionnaire, medecin_conseil, admin]
      responses:
        '200':
          description: Règles.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/rules/{rule_code}/versions:
    get:
      operationId: listRuleVersions
      summary: Versions d'une règle
      description: Historique complet des versions d'une règle.
      tags: [regles]
      x-lot: L2
      x-roles: [gestionnaire, medecin_conseil, admin]
      parameters:
        - $ref: '#/components/parameters/RuleCode'
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleVersionList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createRuleVersion
      summary: Créer une version de règle (brouillon)
      description: Nouveaux paramètres avec date d'effet ; aucun effet avant publication.
      tags: [regles]
      x-lot: L2
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/RuleCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRuleVersionRequest'}
      responses:
        '201':
          description: Version créée en brouillon.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleVersion'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/rule-versions/{rule_version_id}/publication:
    post:
      operationId: publishRuleVersion
      summary: Publier une version de règle
      description: Met la version en vigueur à sa date d'effet. Refus si chevauchement (RUL-02).
      tags: [regles]
      x-lot: L2
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/RuleVersionId'
      responses:
        '200':
          description: Version publiée.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleVersion'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/rules/evaluation:
    post:
      operationId: evaluateRules
      summary: Simuler une décision
      description: |
        Évalue les règles sans rien enregistrer (même entrée + même version = même décision).
        Les versions de produit et de règle sont celles en vigueur à `service_date`.
      tags: [regles]
      x-lot: L2
      x-roles: [gestionnaire, medecin_conseil, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EvaluateRulesRequest'}
      responses:
        '200':
          description: Décision simulée et trace par règle.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Decision'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  # -------------------------------------------------------- L3 grand livre
  /v1/ledger/accounts:
    get:
      operationId: listLedgerAccounts
      summary: Plan de comptes
      description: Comptes du grand livre de l'organisation.
      tags: [grand-livre]
      x-lot: L3
      x-roles: [gestionnaire, admin]
      responses:
        '200':
          description: Comptes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LedgerAccountList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/ledger/entries:
    get:
      operationId: listLedgerEntries
      summary: Journal
      description: Écritures et leurs lignes, les plus récentes d'abord.
      tags: [grand-livre]
      x-lot: L3
      x-roles: [gestionnaire, admin]
      parameters:
        - name: account_code
          in: query
          description: Filtre sur un compte (par exemple 6011).
          schema: {type: string, pattern: '^[0-9]{4,8}$'}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page d'écritures.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LedgerEntryList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/ledger/entries/{entry_id}:
    get:
      operationId: getLedgerEntry
      summary: Détail d'une écriture
      description: Écriture, lignes et éventuelle contre-passation.
      tags: [grand-livre]
      x-lot: L3
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/EntryId'
      responses:
        '200':
          description: Écriture.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LedgerEntry'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/ledger/entries/{entry_id}/reversal:
    post:
      operationId: reverseLedgerEntry
      summary: Contre-passer une écriture
      description: Crée une écriture inverse liée à l'originale. Une écriture ne se contre-passe qu'une fois (LED-01).
      tags: [grand-livre]
      x-lot: L3
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/EntryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReverseLedgerEntryRequest'}
      responses:
        '201':
          description: Écriture de contre-passation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LedgerEntry'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/ledger/balance:
    get:
      operationId: getLedgerBalance
      summary: Balance
      description: Totaux débit / crédit par compte à une date ; le total général est toujours équilibré.
      tags: [grand-livre]
      x-lot: L3
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/AtDate'
      responses:
        '200':
          description: Balance.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LedgerBalance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  # ------------------------------------------------------- L4 adhérents
  /v1/members:
    get:
      operationId: listMembers
      summary: Lister les adhérents
      description: Recherche par nom ou numéro MulemaCare ; filtre par statut.
      tags: [adherents]
      x-lot: L4
      x-roles: [gestionnaire, admin]
      parameters:
        - name: status
          in: query
          description: Statut de l'adhérent.
          schema: {$ref: '#/components/schemas/MemberStatus'}
        - name: q
          in: query
          description: Texte recherché (nom ou numéro).
          schema: {type: string, minLength: 2}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page d'adhérents.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createMember
      summary: Adhérer
      description: Crée le titulaire ; statut initial « carence » jusqu'à la fin du délai de la version de produit.
      tags: [adherents]
      x-lot: L4
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMemberRequest'}
      responses:
        '201':
          description: Adhérent créé.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/members/{member_id}:
    get:
      operationId: getMember
      summary: Fiche adhérent
      description: Identité, formule, payeur, famille et statut. Aucune donnée médicale.
      tags: [adherents]
      x-lot: L4
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Adhérent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/members/{member_id}/dependents:
    post:
      operationId: addDependent
      summary: Ajouter un ayant droit
      description: Ajoute un conjoint, un enfant ou un autre ayant droit au contrat.
      tags: [adherents]
      x-lot: L4
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddDependentRequest'}
      responses:
        '201':
          description: Ayant droit ajouté.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dependent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/members/{member_id}/entitlements:
    get:
      operationId: getMemberEntitlements
      summary: Droits d'un adhérent
      description: Statut, fin de carence, plafond familial consommé et restant à une date.
      tags: [adherents]
      x-lot: L4
      x-roles: [gestionnaire, medecin_conseil, admin]
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/AtDate'
      responses:
        '200':
          description: Droits.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Entitlements'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/members/{member_id}/cards:
    post:
      operationId: issueCard
      summary: Émettre ou réémettre une carte
      description: Émet une carte à QR dynamique pour un bénéficiaire ; l'ancienne carte active est révoquée.
      tags: [adherents]
      x-lot: L4
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssueCardRequest'}
      responses:
        '201':
          description: Carte émise.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Card'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/members/{member_id}/status-changes:
    post:
      operationId: changeMemberStatus
      summary: Changer le statut d'un adhérent
      description: |
        Décision du gestionnaire (motif `decision_gestionnaire`), journalisée dans
        member_status_history et l'audit ; émet `member.status_changed`. Les changements
        automatiques (fin de carence, paiement confirmé, impayé J+45) ne passent pas par ici.
        Transition impossible : 409 MBR-01.
      tags: [adherents]
      x-lot: L4
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeMemberStatusRequest'}
      responses:
        '200':
          description: Adhérent avec son nouveau statut.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/members/{member_id}/contributions:
    get:
      operationId: listMemberContributions
      summary: Cotisations d'un adhérent
      description: Échéances et paiements, du plus récent au plus ancien.
      tags: [cotisations]
      x-lot: L4
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Cotisations.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContributionList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/members/{member_id}/reminders:
    post:
      operationId: sendReminder
      summary: Relancer un adhérent
      description: Met en file un SMS ou un message WhatsApp de relance, avec lien de paiement.
      tags: [cotisations]
      x-lot: L4
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReminderRequest'}
      responses:
        '202':
          description: Message mis en file.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedMessage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/contributions/{contribution_id}/payment-links:
    post:
      operationId: createPaymentLink
      summary: Créer un lien de paiement
      description: Lien à usage unique pour qu'un proche (diaspora) paie la cotisation.
      tags: [cotisations]
      x-lot: L4
      x-roles: [gestionnaire, admin]
      parameters:
        - $ref: '#/components/parameters/ContributionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Lien créé (le jeton n'est montré qu'une fois).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/public/payment-links/{token}:
    get:
      operationId: getPublicPaymentLink
      summary: Ouvrir un lien de paiement
      description: Page publique du payeur. Montre le montant et des initiales seulement.
      tags: [cotisations]
      x-lot: L4
      x-roles: [public]
      security: []
      parameters:
        - $ref: '#/components/parameters/PaymentToken'
      responses:
        '200':
          description: Cotisation à payer.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicPaymentLink'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}

  /v1/public/payment-links/{token}/checkout:
    post:
      operationId: startCheckout
      summary: Payer par un canal
      description: Démarre le paiement (canaux simulés tant que l'accès API n'est pas tranché, PRD §10 Q1).
      tags: [cotisations]
      x-lot: L4
      x-roles: [public]
      security: []
      parameters:
        - $ref: '#/components/parameters/PaymentToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckoutRequest'}
      responses:
        '201':
          description: Paiement démarré.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Checkout'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/webhooks/{organization_slug}/payments/{channel}:
    post:
      operationId: receivePaymentWebhook
      summary: Webhook de paiement
      description: |
        Notification d'un canal de paiement. Signature vérifiée (PAY-01), idempotente sur
        `event_id` : un même webhook rejoué renvoie 200 avec `duplicate: true` et ne crée rien.
        Un paiement confirmé ouvre les droits en moins de 60 s (R2).
      tags: [cotisations]
      x-lot: L4
      x-roles: [canal_de_paiement]
      security:
        - webhookSignature: []
      parameters:
        - name: organization_slug
          in: path
          required: true
          description: Identifiant public de l'organisation destinataire.
          schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
        - name: channel
          in: path
          required: true
          description: Canal de paiement.
          schema: {$ref: '#/components/schemas/PaymentChannel'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentWebhookRequest'}
      responses:
        '200':
          description: Notification traitée (ou déjà traitée).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookAck'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  # ------------------------------------------------------- L5 comptoir
  /v1/counter/identifications:
    post:
      operationId: startIdentification
      summary: Scanner la carte
      description: Étape 1 du comptoir. Lit le QR dynamique (ou le numéro MulemaCare) et renvoie l'identité à confirmer.
      tags: [comptoir]
      x-lot: L5
      x-roles: [clinique]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartIdentificationRequest'}
      responses:
        '201':
          description: Identification ouverte.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identification'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '423': {$ref: '#/components/responses/Locked'}

  /v1/counter/identifications/{identification_id}/photo-confirmation:
    post:
      operationId: confirmPhoto
      summary: Confirmer la photo
      description: Étape 2. L'accueil confirme (ou non) que la personne présente est celle de la photo.
      tags: [comptoir]
      x-lot: L5
      x-roles: [clinique]
      parameters:
        - $ref: '#/components/parameters/IdentificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhotoConfirmationRequest'}
      responses:
        '200':
          description: Identification mise à jour (refusée si `confirmed` vaut false, code ID-02).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identification'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/counter/identifications/{identification_id}/code:
    post:
      operationId: sendIdentificationCode
      summary: Envoyer le code SMS
      description: Étape 3. Envoie un code à usage unique au téléphone de l'adhérent (renvoi possible).
      tags: [comptoir]
      x-lot: L5
      x-roles: [clinique]
      parameters:
        - $ref: '#/components/parameters/IdentificationId'
      responses:
        '202':
          description: Code envoyé.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodeSent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '423': {$ref: '#/components/responses/Locked'}

  /v1/counter/identifications/{identification_id}/code-verification:
    post:
      operationId: verifyIdentificationCode
      summary: Vérifier le code SMS
      description: |
        Code faux : 422 ID-03 avec le nombre d'essais restants. Au seuil de la règle ID-03
        (3 codes faux, proto), la carte est bloquée 15 min : 423 ID-04 avec `retry_after_seconds`.
      tags: [comptoir]
      x-lot: L5
      x-roles: [clinique]
      parameters:
        - $ref: '#/components/parameters/IdentificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CodeVerificationRequest'}
      responses:
        '200':
          description: Identité vérifiée par les trois facteurs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identification'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '423': {$ref: '#/components/responses/Locked'}

  /v1/counter/offline-policy:
    get:
      operationId: getOfflinePolicy
      summary: Politique hors ligne
      description: Seuil et durée de validité des accords provisoires, et barème à mettre en cache sur l'appareil.
      tags: [comptoir]
      x-lot: L5
      x-roles: [clinique]
      responses:
        '200':
          description: Politique en vigueur.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfflinePolicy'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/counter/devices:
    post:
      operationId: registerCounterDevice
      summary: Enregistrer un appareil de comptoir
      description: Enregistre la clé publique qui signe les accords provisoires hors ligne.
      tags: [comptoir]
      x-lot: L5
      x-roles: [clinique]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterCounterDeviceRequest'}
      responses:
        '201':
          description: Appareil enregistré.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CounterDevice'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/authorizations/offline-sync:
    post:
      operationId: syncOfflineAuthorizations
      summary: Synchroniser les accords provisoires
      description: |
        File de synchronisation du comptoir (R13). Idempotent par (`device_id`, `offline_ref`).
        Chaque accord est confirmé ou rejeté (OFF-01 expiré, OFF-02 signature invalide,
        OFF-03 au-dessus du seuil, OFF-04 appareil révoqué) ; émet `authorization.synced`.
      tags: [comptoir]
      x-lot: L5
      x-roles: [clinique]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfflineSyncRequest'}
      responses:
        '200':
          description: Résultat par accord.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfflineSyncResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  # ----------------------------------------------- L5 prises en charge
  /v1/claims:
    get:
      operationId: listClaims
      summary: Lister les prises en charge
      description: Une clinique ne voit que ses dossiers. Aucune donnée médicale.
      tags: [prises-en-charge]
      x-lot: L5
      x-roles: [gestionnaire, medecin_conseil, clinique, admin]
      parameters:
        - name: status
          in: query
          description: Statut du dossier.
          schema: {$ref: '#/components/schemas/ClaimStatus'}
        - name: fraud_flagged
          in: query
          description: Seulement les alertes fraude.
          schema: {type: boolean}
        - name: member_id
          in: query
          description: Dossiers d'un adhérent.
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page de dossiers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClaimList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createClaim
      summary: Demander une prise en charge
      description: |
        Étapes 4 et 5 du comptoir. Exige une identification vérifiée. Le moteur de règles décide :
        accord automatique (R-12), revue du médecin-conseil (R-20, aucun paiement créé) ou refus
        avec code stable (R-01, R-04, R-07, R-09). La décision est renvoyée dans `decision`,
        le dossier est créé dans tous les cas (201).
      tags: [prises-en-charge]
      x-lot: L5
      x-roles: [clinique]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateClaimRequest'}
      responses:
        '201':
          description: Dossier créé avec sa décision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClaimCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /v1/claims/{claim_id}:
    get:
      operationId: getClaim
      summary: Détail d'une prise en charge
      description: Actes, montants, historique des décisions (règle et version), accord. Jamais le motif médical.
      tags: [prises-en-charge]
      x-lot: L5
      x-roles: [gestionnaire, medecin_conseil, clinique, admin]
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Dossier.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClaimDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/claims/{claim_id}/decisions:
    post:
      operationId: decideClaim
      summary: Décision du médecin-conseil
      description: Accorder, refuser ou demander des pièces pour un dossier en revue (sinon 409 CLM-01).
      tags: [prises-en-charge]
      x-lot: L5
      x-roles: [medecin_conseil]
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
