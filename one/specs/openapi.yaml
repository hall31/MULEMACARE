    CodeSent:
      type: object
      required: [sent_at, expires_at]
      properties:
        sent_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    CodeVerificationRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string, pattern: '^[0-9]{6}$'}
    CreateClaimRequest:
      type: object
      additionalProperties: false
      required: [identification_id, service_date, items]
      properties:
        identification_id: {type: string, format: uuid}
        service_date: {type: string, format: date}
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ClaimItemInput'}
        healthos_encounter_ref:
          type: string
          description: Référence pseudonyme de la consultation chez HealthOS (jamais le motif).
    ClaimStatus:
      type: string
      enum: [demandee, accordee_auto, en_revue, pieces_demandees, accordee, refusee, payee, annulee]
    ClaimItem:
      type: object
      required: [line_no, act_code, label, quantity, unit_amount_xof, amount_xof, covered_xof]
      properties:
        line_no: {type: integer, minimum: 1}
        act_code: {type: string}
        label: {type: string}
        quantity: {type: integer, minimum: 1}
        unit_amount_xof: {$ref: '#/components/schemas/AmountXof'}
        amount_xof: {$ref: '#/components/schemas/AmountXof'}
        covered_xof: {$ref: '#/components/schemas/AmountXof'}
    ClaimSummary:
      type: object
      required: [id, claim_number, member_id, member_display_name, provider_id, provider_name, service_date, requested_at, status, total_xof, covered_xof, currency, fraud_flagged]
      properties:
        id: {type: string, format: uuid}
        claim_number: {type: string, examples: [PEC-26-09814]}
        member_id: {type: string, format: uuid}
        member_display_name: {type: string}
        provider_id: {type: string, format: uuid}
        provider_name: {type: string}
        service_date: {type: string, format: date}
        requested_at: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/ClaimStatus'}
        total_xof: {$ref: '#/components/schemas/AmountXof'}
        covered_xof: {$ref: '#/components/schemas/AmountXof'}
        currency: {$ref: '#/components/schemas/Currency'}
        fraud_score: {type: [number, 'null'], minimum: 0, maximum: 1}
        fraud_flagged: {type: boolean}
        rule:
          oneOf:
            - {$ref: '#/components/schemas/RuleRef'}
            - {type: 'null'}
    ClaimList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ClaimSummary'}
        page: {$ref: '#/components/schemas/PageInfo'}
    ClaimDecisionRecord:
      type: object
      required: [sequence, outcome, source, reason_code, decided_at]
      properties:
        sequence: {type: integer, minimum: 1}
        outcome: {type: string, enum: [accordee_auto, en_revue, accordee, refusee, pieces_demandees, annulee]}
        source: {type: string, enum: [regle, humain]}
        rule:
          oneOf:
            - {$ref: '#/components/schemas/RuleRef'}
            - {type: 'null'}
        reason_code: {type: string}
        decided_by: {type: [string, 'null'], format: uuid}
        decided_at: {type: string, format: date-time}
    Authorization:
      type: object
      required: [id, authorization_number, kind, status, covered_xof, currency, rule, issued_at]
      properties:
        id: {type: string, format: uuid}
        authorization_number: {type: string}
        kind: {type: string, enum: [en_ligne, provisoire_hors_ligne]}
        status: {type: string, enum: [emise, synchronisee, rejetee_a_la_synchro, expiree, annulee]}
        covered_xof: {$ref: '#/components/schemas/AmountXof'}
        currency: {$ref: '#/components/schemas/Currency'}
        rule: {$ref: '#/components/schemas/RuleRef'}
        issued_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
    ClaimDetail:
      type: object
      required: [claim, items, decisions]
      properties:
        claim: {$ref: '#/components/schemas/ClaimSummary'}
        patient_share_xof: {$ref: '#/components/schemas/AmountXof'}
        plan_version_id: {type: string, format: uuid}
        review_due_at: {type: [string, 'null'], format: date-time}
        items:
          type: array
          items: {$ref: '#/components/schemas/ClaimItem'}
        decisions:
          type: array
          items: {$ref: '#/components/schemas/ClaimDecisionRecord'}
        authorization:
          oneOf:
            - {$ref: '#/components/schemas/Authorization'}
            - {type: 'null'}
    ClaimCreated:
      type: object
      required: [claim, decision]
      properties:
        claim: {$ref: '#/components/schemas/ClaimSummary'}
        decision: {$ref: '#/components/schemas/Decision'}
        authorization:
          oneOf:
            - {$ref: '#/components/schemas/Authorization'}
            - {type: 'null'}
    ClaimDocumentInput:
      type: object
      additionalProperties: false
      required: [kind, healthos_document_ref]
      properties:
        kind: {type: string, enum: [facture, piece_clinique, justificatif_identite, autre]}
        healthos_document_ref:
          type: string
          minLength: 1
          description: Référence du document chez HealthOS ; le contenu n'entre jamais ici.
    SubmitClaimDocumentsRequest:
      type: object
      additionalProperties: false
      required: [documents]
      properties:
        documents:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/ClaimDocumentInput'}
    DecideClaimRequest:
      type: object
      additionalProperties: false
      description: Pas de champ texte libre, pour qu'aucune donnée médicale n'entre dans la base assurance.
      required: [decision, reason_code]
      properties:
        decision: {type: string, enum: [accorder, refuser, demander_pieces]}
        reason_code:
          type: string
          pattern: '^[A-Z]{1,4}-[0-9]{2}$'
          description: Motif administratif codé (liste à valider, voir QUESTIONS.md).
    MedicalReason:
      type: object
      required: [claim_id, text, source, read_at, audit_event_id]
      properties:
        claim_id: {type: string, format: uuid}
        text:
          type: string
          description: Motif renvoyé par HealthOS ; jamais stocké côté assurance.
        source: {type: string, const: healthos}
        read_at: {type: string, format: date-time}
        audit_event_id: {type: string, format: uuid}
    OfflinePolicy:
      type: object
      required: [threshold_xof, validity_minutes, currency, rules, tariff]
      properties:
        threshold_xof:
          $ref: '#/components/schemas/AmountXof'
        validity_minutes: {type: integer, minimum: 1}
        currency: {$ref: '#/components/schemas/Currency'}
        rules:
          type: array
          description: Versions des règles R-12 et HL-01 dont la politique est issue.
          items: {$ref: '#/components/schemas/RuleRef'}
        tariff: {$ref: '#/components/schemas/TariffList'}
    RegisterCounterDeviceRequest:
      type: object
      additionalProperties: false
      required: [label, public_key]
      properties:
        label: {type: string, minLength: 1, maxLength: 80}
        public_key:
          type: string
          description: Clé publique (JWK sérialisée) de l'appareil.
    CounterDevice:
      type: object
      required: [id, label, status, registered_at]
      properties:
        id: {type: string, format: uuid}
        label: {type: string}
        status: {type: string, enum: [actif, revoque]}
        registered_at: {type: string, format: date-time}
    OfflineAuthorizationInput:
      type: object
      additionalProperties: false
      required: [offline_ref, member_number, beneficiary_id, service_date, items, total_xof, covered_xof, issued_at, expires_at, signed_payload, signature]
      properties:
        offline_ref: {type: string, format: uuid}
        member_number: {type: string, pattern: '^MC-[0-9]{8}$'}
        beneficiary_id: {type: string, format: uuid}
        service_date: {type: string, format: date}
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ClaimItemInput'}
        total_xof: {$ref: '#/components/schemas/AmountXof'}
        covered_xof: {$ref: '#/components/schemas/AmountXof'}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        signed_payload:
          type: string
          description: Contenu canonique signé (JSON encodé en base64url).
        signature: {type: string}
    OfflineSyncRequest:
      type: object
      additionalProperties: false
      required: [device_id, authorizations]
      properties:
        device_id: {type: string, format: uuid}
        authorizations:
          type: array
          minItems: 1
          maxItems: 200
          items: {$ref: '#/components/schemas/OfflineAuthorizationInput'}
    OfflineSyncItemResult:
      type: object
      required: [offline_ref, outcome]
      properties:
        offline_ref: {type: string, format: uuid}
        outcome: {type: string, enum: [confirmee, rejetee]}
        reason_code:
          oneOf:
            - {$ref: '#/components/schemas/ErrorCode'}
            - {type: 'null'}
        claim_id: {type: [string, 'null'], format: uuid}
        authorization_id: {type: [string, 'null'], format: uuid}
    OfflineSyncResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/OfflineSyncItemResult'}
    WorkQueue:
      type: object
      required: [claims_in_review, fraud_alerts, members_unpaid_over_30_days, auto_approved_today]
      properties:
        claims_in_review: {type: integer, minimum: 0}
        fraud_alerts: {type: integer, minimum: 0}
        members_unpaid_over_30_days: {type: integer, minimum: 0}
        auto_approved_today: {type: integer, minimum: 0}

    # ------------------------------------------------------------- L8
    JoeQuestionRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: {type: string, minLength: 2, maxLength: 1000}
        claim_id: {type: string, format: uuid}
        member_id: {type: string, format: uuid}
    JoeAnswer:
      type: object
      required: [ai_action_id, kind, answer, sources]
      properties:
        ai_action_id: {type: string, format: uuid}
        kind: {type: string, enum: [reponse, refus]}
        answer: {type: string}
        sources:
          type: array
          description: Obligatoirement non vide si `kind` vaut `reponse`.
          items: {$ref: '#/components/schemas/Source'}
    DecisionDraftRequest:
      type: object
      additionalProperties: false
      required: [claim_id]
      properties:
        claim_id: {type: string, format: uuid}
    DecisionDraft:
      type: object
      required: [ai_action_id, claim_id, recommendation, rationale, sources, applied]
      properties:
        ai_action_id: {type: string, format: uuid}
        claim_id: {type: string, format: uuid}
        recommendation: {type: string, enum: [accorder, refuser, demander_pieces]}
        rationale: {type: string}
        sources:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Source'}
        applied:
          type: boolean
          const: false
          description: Toujours faux ; seul le médecin-conseil décide.
    MessageDraftRequest:
      type: object
      additionalProperties: false
      required: [member_id, purpose]
      properties:
        member_id: {type: string, format: uuid}
        purpose: {type: string, enum: [relance_cotisation, confirmation_accord, demande_pieces]}
    MessageDraft:
      type: object
      required: [ai_action_id, channel, text, sources]
      properties:
        ai_action_id: {type: string, format: uuid}
        channel: {type: string, enum: [sms, whatsapp]}
        text: {type: string}
        sources:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Source'}
    SearchHit:
      type: object
      required: [type, id, label]
      properties:
        type: {type: string, enum: [member, claim, provider]}
        id: {type: string, format: uuid}
        label: {type: string}
        meta: {type: [string, 'null']}
    SearchResults:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SearchHit'}
    AiAction:
      type: object
      required: [id, occurred_at, user_id, kind, tool, sources]
      properties:
        id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
        user_id: {type: string, format: uuid}
        kind: {type: string, enum: [lecture, preparation, reponse, refus]}
        tool: {type: string}
        model: {type: [string, 'null']}
        sources:
          type: array
          items: {$ref: '#/components/schemas/Source'}
    AiActionList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AiAction'}
        page: {$ref: '#/components/schemas/PageInfo'}

    # ------------------------------------------------------------- P1
    BeneficiaryRelationship:
      type: string
      description: Lien avec le titulaire du contrat.
      enum: [titulaire, conjoint, enfant, autre]
    MyCard:
      type: object
      description: |
        Carte d'un bénéficiaire de mon contrat. `qr_payload` est le QR dynamique à afficher
        (foncé sur blanc) ; le redemander à `qr_refresh_at`. `card_status` vaut `bloquee`
        pendant le blocage après trois codes faux (R1, `blocked_until`).
      required: [card_id, person_id, given_name, family_name, relationship, member_number, plan_code, coverage_rate_bp, beneficiaries_count, card_status, blocked_until, qr_payload, qr_generated_at, qr_refresh_at, entitlements]
      properties:
        card_id: {type: string, format: uuid}
        person_id: {type: string, format: uuid}
        given_name: {type: string}
        family_name: {type: string}
        relationship: {$ref: '#/components/schemas/BeneficiaryRelationship'}
        member_number: {type: string, pattern: '^MC-[0-9]{8}$'}
        plan_code: {type: string}
        coverage_rate_bp: {type: integer, minimum: 0, maximum: 10000}
        beneficiaries_count: {type: integer, minimum: 1}
        card_status: {type: string, enum: [active, bloquee]}
        blocked_until: {type: [string, 'null'], format: date-time}
        qr_payload: {type: string, minLength: 16}
        qr_generated_at: {type: string, format: date-time}
        qr_refresh_at:
          type: string
          format: date-time
          description: Début de la fenêtre suivante du QR (30 s).
        entitlements: {$ref: '#/components/schemas/Entitlements'}
    MyBeneficiary:
      type: object
      required: [person_id, given_name, family_name, relationship, valid_from, valid_to, card_status]
      properties:
        person_id: {type: string, format: uuid}
        given_name: {type: string}
        family_name: {type: string}
        relationship: {$ref: '#/components/schemas/BeneficiaryRelationship'}
        valid_from: {type: string, format: date}
        valid_to: {type: [string, 'null'], format: date}
        card_status: {type: string, enum: [active, bloquee, aucune]}
    MyBeneficiaryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MyBeneficiary'}
    MyClaim:
      type: object
      description: Dossier vu par l'adhérent. Aucun acte, motif, score ni règle interne.
      required: [id, claim_number, beneficiary_person_id, beneficiary_given_name, provider_name, service_date, requested_at, status, total_xof, covered_xof, patient_share_xof, currency, rule]
      properties:
        id: {type: string, format: uuid}
        claim_number: {type: string, examples: [PEC-26-09814]}
        beneficiary_person_id: {type: string, format: uuid}
        beneficiary_given_name: {type: string}
        provider_name: {type: string}
        service_date: {type: string, format: date}
        requested_at: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/ClaimStatus'}
        total_xof: {$ref: '#/components/schemas/AmountXof'}
        covered_xof: {$ref: '#/components/schemas/AmountXof'}
        patient_share_xof: {$ref: '#/components/schemas/AmountXof'}
        currency: {$ref: '#/components/schemas/Currency'}
        rule:
          description: Code public et version de la règle appliquée (R-12 v3), ou null.
          oneOf:
            - {$ref: '#/components/schemas/RuleRef'}
            - {type: 'null'}
    MyClaimList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MyClaim'}
        page: {$ref: '#/components/schemas/PageInfo'}
    TrackingStep:
      type: object
      description: |
        Étape de la frise. `key` et `state` sont des codes ; les libellés sont dans les fichiers
        de traduction de l'interface. `at` est nul quand le contrat ne date pas l'étape.
      required: [key, state, at, rule, reason_code]
      properties:
        key: {type: string, enum: [demande_recue, accordee, virement, recu]}
        state: {type: string, enum: [fait, en_cours, a_venir, refuse, annule, sans_objet]}
        at: {type: [string, 'null'], format: date-time}
        rule:
          oneOf:
            - {$ref: '#/components/schemas/RuleRef'}
            - {type: 'null'}
        reason_code:
          type: [string, 'null']
          description: Code stable de la décision (R-12, ou motif administratif MC-02).
    ClaimTracking:
      type: object
      required: [claim, steps]
      properties:
        claim: {$ref: '#/components/schemas/MyClaim'}
        steps:
          type: array
          minItems: 4
          maxItems: 4
          items: {$ref: '#/components/schemas/TrackingStep'}
    MyContribution:
      type: object
      description: Cotisation de mon contrat, avec le type et le pays du payeur (aucune autre donnée sur lui).
      required: [id, period_start, due_on, amount_xof, currency, status, paid_at, channel, payer_kind, payer_country_code]
      properties:
        id: {type: string, format: uuid}
        period_start: {type: string, format: date}
        due_on: {type: string, format: date}
        amount_xof: {$ref: '#/components/schemas/AmountXof'}
        currency: {$ref: '#/components/schemas/Currency'}
        status: {type: string, enum: [a_payer, payee, en_retard, annulee]}
        paid_at: {type: [string, 'null'], format: date-time}
        channel:
          oneOf:
            - {$ref: '#/components/schemas/PaymentChannel'}
            - {type: 'null'}
        payer_kind: {type: [string, 'null'], enum: [adherent, employeur, proche, null]}
        payer_country_code: {type: [string, 'null'], pattern: '^[A-Z]{2}$'}
    MyContributions:
      type: object
      required: [items, next_due]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MyContribution'}
        next_due:
          description: Plus ancienne échéance à payer (a_payer ou en_retard), ou null.
          oneOf:
            - {$ref: '#/components/schemas/MyContribution'}
            - {type: 'null'}

    # ------------------------------------------------------------- P2
    ProductEventName:
      type: string
      description: Liste blanche FERMÉE des événements d'usage (CR-P2-01). Tout autre nom est refusé (422).
      enum:
        - onboarding_started
        - onboarding_step
        - onboarding_completed
        - card_presented
        - counter_decision_shown
        - payment_link_created
        - palette_opened
        - joe_question_asked
        - notification_opened
        - offline_banner_seen
        - claim_tracking_viewed
    ProductSurface:
      type: string
      description: Écran d'origine ; il doit correspondre au rôle déclaré.
      enum: [console, comptoir, espace_adherent]
    ProductEventVariant:
      type: string
      description: Variante bornée d'un événement (voir `recordProductEvent`).
      enum: [en_ligne, hors_ligne, accordee, revue, refusee, clavier, bouton, exemple, saisie, sms, whatsapp, in_app]
    ProductEventRequest:
      type: object
      description: Événement d'usage. Aucun texte libre, aucun identifiant de personne, aucun champ inconnu.
      additionalProperties: false
      required: [name, surface, role, session_id]
      properties:
        name: {$ref: '#/components/schemas/ProductEventName'}
        surface: {$ref: '#/components/schemas/ProductSurface'}
        role: {$ref: '#/components/schemas/Role'}
        session_id:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: 16 octets aléatoires du navigateur en hexadécimal minuscule, renouvelés ; validés puis écartés (ni stockés, ni dérivés).
        duration_ms:
          type: integer
          minimum: 0
          maximum: 3600000
          description: Durée mesurée par l'écran, en millisecondes ; seulement pour counter_decision_shown (obligatoire, 300 000 au plus) et onboarding_completed (facultative), refusée ailleurs.
        step:
          type: integer
          minimum: 1
          maximum: 20
          description: Numéro d'étape (onboarding_step seulement).
        variant: {$ref: '#/components/schemas/ProductEventVariant'}
    ProductMetricKey:
      type: string
      description: |
        Indicateur et comportement mesuré :
        `claims_auto_approved_rate` dossiers dont la première décision est un accord automatique ;
        `claims_review_rate` dossiers routés en revue du médecin-conseil ;
        `claims_decision_median_ms` délai demande → première décision définitive (accord ou refus) ;
        `counter_decision_display_median_ms` scan → écran de décision au comptoir ;
        `onboarding_completion_rate` accueils terminés sur accueils commencés ;
        `first_card_median_ms` début de l'accueil → première carte présentée ;
        `payment_links_paid_rate` cotisations payées parmi celles qui ont reçu un lien ;
        `ledger_balance_gap_xof` total des débits moins total des crédits (attendu : 0) ;
        `webhook_duplicate_rate` cotisations reçues plus d'une fois (attendu : 0).
        Contributeurs : bénéficiaires distincts (dossiers), personnes distinctes (événements
        d'usage, empreinte de l'utilisateur et non de la session), adhérents distincts (liens,
        cotisations), écritures (grand livre).
      enum:
        - claims_auto_approved_rate
        - claims_review_rate
        - claims_decision_median_ms
        - counter_decision_display_median_ms
        - onboarding_completion_rate
        - first_card_median_ms
        - payment_links_paid_rate
        - ledger_balance_gap_xof
        - webhook_duplicate_rate
    ProductMetric:
      type: object
      required: [key, unit, status, value, contributors]
      properties:
        key: {$ref: '#/components/schemas/ProductMetricKey'}
        unit:
          type: string
          enum: [pour_dix_mille, millisecondes, xof]
        status:
          type: string
          description: '`masque` : moins de 5 contributeurs sur la période ou sur l''une de ses semaines non vides, aucune valeur publiée.'
          enum: [disponible, masque]
        value:
          type: [integer, 'null']
          format: int64
          description: Valeur entière ; null si masquée.
        contributors:
          type: [integer, 'null']
          minimum: 5
          description: Palier de l'effectif qui porte la valeur, jamais l'effectif exact (5 = de 5 à 9, 10 = de 10 à 19, 20 = de 20 à 49, 50 = de 50 à 99, 100 = 100 ou plus) ; null si masquée.
    ProductMetrics:
      type: object
      required: [period_from, period_to, generated_at, k_anonymity_threshold, items]
      properties:
        period_from: {type: string, format: date}
        period_to: {type: string, format: date}
        generated_at: {type: string, format: date-time}
        k_anonymity_threshold:
          type: integer
          const: 5
          description: Effectif minimal pour publier un indicateur.
        items:
          type: array
          items: {$ref: '#/components/schemas/ProductMetric'}

    # ------------------------------------------------------------- P3 (CR-P3-01)
    HexColor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      description: Couleur `#RRGGBB` ; aucune autre forme (ni nom, ni rgb(), ni CSS).
    BrandTokenOverrides:
      type: object
      description: |
        Liste FERMÉE des jetons surchargeables (`--accent`, `--accent-hover`, `--accent-fg`,
        `--brand-deep` ; le focus suit l'accent). Toute autre clé : 422 BRD-02.
      additionalProperties: false
      properties:
        accent: {$ref: '#/components/schemas/HexColor'}
        accent_hover: {$ref: '#/components/schemas/HexColor'}
        accent_fg: {$ref: '#/components/schemas/HexColor'}
        brand_deep: {$ref: '#/components/schemas/HexColor'}
    BrandTheme:
      type: object
      description: Surcharges par thème ; le plein soleil (noir sur blanc) ne se surcharge pas.
      additionalProperties: false
      properties:
        light: {$ref: '#/components/schemas/BrandTokenOverrides'}
        dark: {$ref: '#/components/schemas/BrandTokenOverrides'}
    BrandLogo:
      type: object
      additionalProperties: false
      required: [kind, src]
      properties:
        kind:
          type: string
          enum: [url, data_uri]
        src:
          type: string
          minLength: 1
          maxLength: 43756
          description: Chemin interne, https vers un hôte autorisé, ou data-URI d'image (32 Ko).
    OrganizationBranding:
      type: object
      description: Marque publique (non sensible) d'une organisation.
      required: [slug, display_name, country_code, currency, logo, theme, custom_domain, legal_notice, privacy_notice]
      properties:
        slug: {type: string}
        display_name: {type: string}
        country_code: {type: string, enum: [CI, SN]}
        currency: {$ref: '#/components/schemas/Currency'}
        logo:
          oneOf:
            - {$ref: '#/components/schemas/BrandLogo'}
            - {type: 'null'}
        theme: {$ref: '#/components/schemas/BrandTheme'}
        custom_domain: {type: [string, 'null']}
        legal_notice: {type: [string, 'null']}
        privacy_notice: {type: [string, 'null']}
    BrandingSettings:
      type: object
      description: Réglages de marque de l'organisation du jeton.
      required: [display_name, logo, theme, custom_domain, legal_notice, privacy_notice, customized, updated_at, custom_domain_status, custom_domain_verification]
      properties:
        display_name: {type: string}
        logo:
          oneOf:
            - {$ref: '#/components/schemas/BrandLogo'}
            - {type: 'null'}
        theme: {$ref: '#/components/schemas/BrandTheme'}
        custom_domain: {type: [string, 'null']}
        legal_notice: {type: [string, 'null']}
        privacy_notice: {type: [string, 'null']}
        customized:
          type: boolean
          description: Faux tant que l'organisation n'a rien réglé (valeurs par défaut).
        updated_at: {type: [string, 'null'], format: date-time}
        custom_domain_status:
          type: [string, 'null']
          enum: [en_attente_de_verification, verifie, null]
          description: |
            CR-P3-02 (ajout). Null sans domaine ; `en_attente_de_verification` tant que la
            propriété n'est pas prouvée (domaine jamais servi) ; `verifie` ensuite.
        custom_domain_verification:
          oneOf:
            - {$ref: '#/components/schemas/DomainVerification'}
            - {type: 'null'}
          description: CR-P3-02 (ajout). Enregistrement DNS à publier ; null sans domaine.
    DomainVerification:
      type: object
      description: Enregistrement DNS TXT qui prouve la propriété du domaine personnalisé.
      required: [record_type, record_name, record_value]
      properties:
        record_type: {type: string, enum: [TXT]}
        record_name:
          type: string
          description: Nom à créer, `_mulemacare-verification.<domaine>`.
        record_value:
          type: string
          description: Valeur exacte, `mulemacare-verification=<jeton de 32 hexadécimaux>`.
    UpdateBrandingRequest:
      type: object
      description: Remplace tous les réglages de marque (texte brut, aucun balisage).
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 80}
        logo:
          oneOf:
            - {$ref: '#/components/schemas/BrandLogo'}
            - {type: 'null'}
        theme: {$ref: '#/components/schemas/BrandTheme'}
        custom_domain:
          type: [string, 'null']
          maxLength: 253
          pattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
        legal_notice: {type: [string, 'null'], maxLength: 4000}
        privacy_notice: {type: [string, 'null'], maxLength: 4000}
    KAnonymousValue:
      type: object
      description: Valeur entière publiée seulement si portée par au moins 5 personnes.
      required: [status, value, contributors]
      properties:
        status:
          type: string
          enum: [disponible, masque]
        value:
          type: [integer, 'null']
          format: int64
          description: Null si masquée.
        contributors:
          type: [integer, 'null']
          minimum: 5
          description: |
            Personnes distinctes qui portent la valeur, publiées par palier (5, 10, 20, 50, 100 :
            plancher du palier, jamais l'effectif exact) ; null si masquée.
    StatusCount:
      type: object
      required: [status, count]
      properties:
        status: {type: string, enum: [actif, carence, suspendu]}
        count: {$ref: '#/components/schemas/KAnonymousValue'}
    BenefitCategory:
      type: object
      description: Prestations d'une catégorie de garantie (jamais d'acte ni de motif) ; `autres` regroupe les catégories sous le seuil.
      required: [category, claims, covered_xof]
      properties:
        category: {type: string, pattern: '^[a-z_]{2,40}$'}
        claims: {$ref: '#/components/schemas/KAnonymousValue'}
        covered_xof: {$ref: '#/components/schemas/KAnonymousValue'}
    ProviderShare:
      type: object
      required: [provider_id, name, claims, covered_xof]
      properties:
        provider_id: {type: string, format: uuid}
        name: {type: string}
        claims: {$ref: '#/components/schemas/KAnonymousValue'}
        covered_xof: {$ref: '#/components/schemas/KAnonymousValue'}
    OtherProviders:
      type: object
      description: Tous les prestataires hors du classement, fondus ; masqué sous le seuil.
      required: [claims, covered_xof]
      properties:
        claims: {$ref: '#/components/schemas/KAnonymousValue'}
        covered_xof: {$ref: '#/components/schemas/KAnonymousValue'}
    InsurerPortfolio:
      type: object
      required: [period_from, period_to, generated_at, k_anonymity_threshold, currency, members_total, members_by_status, premiums_xof, claims_cost_xof, loss_ratio_bp, benefits_by_category, top_providers, other_providers, decision_delay_mean_ms, automation_rate_bp]
      properties:
        period_from: {type: string, format: date}
        period_to: {type: string, format: date}
        generated_at: {type: string, format: date-time}
        k_anonymity_threshold: {type: integer, const: 5}
        currency: {$ref: '#/components/schemas/Currency'}
        members_total: {$ref: '#/components/schemas/KAnonymousValue'}
        members_by_status:
          type: array
          items: {$ref: '#/components/schemas/StatusCount'}
        premiums_xof: {$ref: '#/components/schemas/KAnonymousValue'}
        claims_cost_xof: {$ref: '#/components/schemas/KAnonymousValue'}
        loss_ratio_bp: {$ref: '#/components/schemas/KAnonymousValue'}
        benefits_by_category:
          type: array
          items: {$ref: '#/components/schemas/BenefitCategory'}
        top_providers:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/ProviderShare'}
        other_providers: {$ref: '#/components/schemas/OtherProviders'}
        decision_delay_mean_ms: {$ref: '#/components/schemas/KAnonymousValue'}
        automation_rate_bp: {$ref: '#/components/schemas/KAnonymousValue'}
    EmployerGroupConsumption:
      type: object
      required: [employer_id, name, members_total, members_by_status, claims, covered_xof, benefits_by_category]
      properties:
        employer_id: {type: string, format: uuid}
        name: {type: string}
        members_total: {$ref: '#/components/schemas/KAnonymousValue'}
        members_by_status:
          type: array
          items: {$ref: '#/components/schemas/StatusCount'}
        claims: {$ref: '#/components/schemas/KAnonymousValue'}
        covered_xof: {$ref: '#/components/schemas/KAnonymousValue'}
        benefits_by_category:
          type: array
          items: {$ref: '#/components/schemas/BenefitCategory'}
    EmployerConsumption:
      type: object
      required: [period_from, period_to, generated_at, k_anonymity_threshold, currency, groups]
      properties:
        period_from: {type: string, format: date}
        period_to: {type: string, format: date}
        generated_at: {type: string, format: date-time}
        k_anonymity_threshold: {type: integer, const: 5}
        currency: {$ref: '#/components/schemas/Currency'}
        groups:
          type: array
          items: {$ref: '#/components/schemas/EmployerGroupConsumption'}
    EmployerContract:
      type: object
      required: [employer_id, name, contract_start, contract_end, days_remaining, status, members_total]
      properties:
        employer_id: {type: string, format: uuid}
        name: {type: string}
        contract_start: {type: string, format: date}
        contract_end: {type: [string, 'null'], format: date}
        days_remaining:
          type: [integer, 'null']
          description: Jours jusqu'à la fin du contrat (négatif si échu) ; null sans fin.
        status:
          type: string
          enum: [en_cours, a_echeance, echu, sans_echeance]
        members_total: {$ref: '#/components/schemas/KAnonymousValue'}
    EmployerContractList:
      type: object
      required: [as_of, within_days, items]
      properties:
        as_of: {type: string, format: date}
        within_days: {type: integer, minimum: 1, maximum: 365}
        items:
          type: array
          items: {$ref: '#/components/schemas/EmployerContract'}
    FirstManager:
      type: object
      additionalProperties: false
      required: [idp_subject, display_name]
      properties:
        idp_subject: {type: string, minLength: 1, maxLength: 200}
        display_name: {type: string, minLength: 1, maxLength: 120}
        email: {type: string, format: email}
    TemplateRef:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,39}$'}
        version:
          type: integer
          minimum: 1
          description: Par défaut, la dernière version du code.
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [slug, name, country_code, capabilities, first_manager, template]
      properties:
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
        name: {type: string, minLength: 1, maxLength: 120}
        country_code: {type: string, enum: [CI, SN]}
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [porteur_de_risque, gestionnaire, distributeur]}
        regulator: {type: [string, 'null'], maxLength: 40}
        first_manager: {$ref: '#/components/schemas/FirstManager'}
        template: {$ref: '#/components/schemas/TemplateRef'}
    TemplateContents:
      type: object
      required: [ledger_accounts, rules, plans, coverages, acts, tariff_items]
      properties:
        ledger_accounts: {type: integer, minimum: 0}
        rules: {type: integer, minimum: 0}
        plans: {type: integer, minimum: 0}
        coverages: {type: integer, minimum: 0}
        acts: {type: integer, minimum: 0}
        tariff_items: {type: integer, minimum: 0}
    OrganizationOnboarding:
      type: object
      required: [organization, first_manager, template, copied]
      properties:
        organization: {$ref: '#/components/schemas/Organization'}
        first_manager: {$ref: '#/components/schemas/User'}
        template:
          type: object
          required: [code, version]
          properties:
            code: {type: string}
            version: {type: integer, minimum: 1}
        copied: {$ref: '#/components/schemas/TemplateContents'}
    ConfigurationTemplate:
      type: object
      required: [id, code, version, country_code, label, created_at, contents]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        version: {type: integer, minimum: 1}
        country_code: {type: string, enum: [CI, SN]}
        label: {type: string}
        created_at: {type: string, format: date-time}
        contents: {$ref: '#/components/schemas/TemplateContents'}
    ConfigurationTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ConfigurationTemplate'}
    CreateConfigurationTemplateRequest:
      type: object
      additionalProperties: false
      required: [code, country_code, label]
      properties:
        code: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,39}$'}
        country_code: {type: string, enum: [CI, SN]}
        label: {type: string, minLength: 1, maxLength: 120}
