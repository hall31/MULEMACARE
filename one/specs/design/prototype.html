:root[data-skin="apple"] .panel,:root[data-skin="apple"] .joe-card{border-color:transparent}
:root[data-skin="apple"] .kpis{border-color:transparent}
:root[data-skin="stripe"] .panel{box-shadow:0 1px 3px rgba(50,50,93,.1)}

/* Sélecteur de thème dans la barre du haut */
.theme-btn{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 8px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);font-size:12px;font-weight:500;min-height:32px}
.theme-btn:hover{background:var(--sunk)}
.sw{display:inline-flex;width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);overflow:hidden;flex:none}
.sw i{flex:1;display:block}
.tmenu-wrap{position:relative}
.tmenu{position:absolute;right:0;top:calc(100% + 8px);width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:6px;z-index:15;display:flex;flex-direction:column;gap:2px}
.tmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:var(--r-md);text-align:left;min-height:40px}
.tmenu button:hover{background:var(--sunk)}
.tmenu button[aria-checked="true"]{background:var(--accent-2);color:var(--accent)}
.tmenu small{display:block;color:var(--fg-3);font-size:11px}
.tmenu .chk{margin-left:auto;font-weight:700}
:root[data-skin="google"] .kpis{gap:12px;background:transparent;border:0}
:root[data-skin="google"] .kpi{border-radius:var(--r-md);background:var(--sunk)}
:root[data-skin="google"] .panel,:root[data-skin="google"] .joe-card{border-color:transparent;box-shadow:0 1px 2px rgba(60,64,67,.15)}
:root[data-skin="google"] .nav a{border-radius:999px}
:root[data-skin="notion"] .nav a{padding:5px 10px}
:root[data-skin="notion"] .side{background:var(--sunk)}
:root[data-skin="anthropic"] h1{font-weight:500;font-size:30px}

.theme-row{display:flex;gap:6px}
.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--line);border-radius:999px;background:var(--sunk)}
.seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--fg-2);font-size:12px;font-weight:500;padding:5px 10px;border-radius:999px;min-height:28px}
.seg button svg{width:14px;height:14px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
@media (max-width:900px){.seg button span{display:none}.seg button{padding:5px 8px}}
.theme-row .select{flex:1;min-width:0}

/* ===== Comptoir mobile : règles d'accessibilité façon Material (48 px, 16 px, contraste renforcé) ===== */
.mob-wrap{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start}
.phone{border:1px solid var(--line-2);border-radius:28px;background:var(--bg);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:720px;max-width:100%}
.m-app{--m-t:48px;font-size:16px;line-height:1.45;color:var(--fg);background:var(--bg);display:flex;flex-direction:column;flex:1}
.m-app .m-secondary{color:var(--fg)}
.m-bar{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.m-bar b{font-family:var(--f-display);font-size:17px}
.m-prog{height:4px;background:var(--sunk)} .m-prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.m-net{padding:10px 16px;background:var(--warn-bg);color:var(--warn);font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center}
.m-body{flex:1;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.m-body h2{font-size:22px;line-height:1.25}
.m-step{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.m-foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.m-btn{min-height:56px;width:100%;border-radius:999px;border:0;background:var(--accent);color:var(--accent-fg);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px}
.m-btn.sec{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.m-btn.bad{background:transparent;color:var(--crit);border:2px solid var(--crit)}
.m-btn:disabled{opacity:.4;cursor:not-allowed}
.m-scan{border:2px dashed var(--line-2);border-radius:20px;aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;background:var(--surface);color:var(--fg)}
.m-scan svg{width:96px;height:96px}
.m-field{display:flex;flex-direction:column;gap:6px}
.m-field label{font-size:15px;font-weight:500}
.m-input{min-height:var(--m-t);border:2px solid var(--line-2);border-radius:12px;padding:0 14px;font-size:17px;background:var(--surface)}
.m-input:focus{outline:none;border-color:var(--accent)}
.m-otp{font-family:var(--f-mono);font-size:30px;letter-spacing:.35em;text-align:center;min-height:64px}
.m-id{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-align:center}
.m-id .photo{width:120px;height:120px;border-radius:20px;font-size:40px}
.m-acts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.m-act{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;font-size:16px}
.m-act:last-child{border-bottom:0}
.m-box{width:26px;height:26px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;font-size:16px;color:var(--accent-fg)}
.m-act[aria-checked="true"] .m-box{background:var(--accent);border-color:var(--accent)}
.m-act .num{margin-left:auto;font-size:15px}
.m-total{display:flex;justify-content:space-between;align-items:baseline;font-size:17px}
.m-total b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.m-split{display:grid;gap:10px}
.m-split div{padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.m-split .big{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.m-split .mc{background:var(--accent-2);border-color:transparent} .m-split .mc .big{color:var(--accent)}
.m-verdict{padding:16px;border-radius:16px;font-size:16px;display:flex;flex-direction:column;gap:6px}
.m-verdict.auto{background:var(--ok-bg);color:var(--ok)} .m-verdict.review{background:var(--warn-bg);color:var(--warn)}
.m-verdict b{font-size:18px}
.m-done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:24px}
.m-done .ring{width:96px;height:96px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:48px}
.m-cash{padding:16px;border-radius:16px;border:2px solid var(--fg);width:100%;font-size:17px}
.m-cash b{font-family:var(--f-display);font-size:28px;display:block;font-variant-numeric:tabular-nums}
/* Mode plein soleil : noir sur blanc, traits épais — volontairement identique quel que soit le thème */
.m-app.sun{--bg:#ffffff;--surface:#ffffff;--sunk:#e8e8e8;--line:#000000;--line-2:#000000;--fg:#000000;--fg-2:#000000;--fg-3:#000000;--accent:#0038a8;--accent-2:#dfe7ff;--accent-fg:#ffffff;--ok:#00551f;--ok-bg:#d8f5de;--warn:#6b3d00;--warn-bg:#ffe7b3;--crit:#9c0000;--crit-bg:#ffdcdc;color-scheme:light}
.m-app.sun .m-act,.m-app.sun .m-bar,.m-app.sun .m-foot{border-width:2px}
.rules{display:flex;flex-direction:column;gap:14px}
.rule-item{display:flex;gap:12px;align-items:flex-start}
.rule-item .k{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:6px;background:var(--accent-2);color:var(--accent);white-space:nowrap;margin-top:2px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.switch{width:44px;height:26px;border-radius:999px;border:0;background:var(--line-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)} .switch[aria-checked="true"]::after{left:21px}
@media (max-width:900px){.mob-wrap{grid-template-columns:1fr}.phone{border-radius:20px;min-height:0}}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:600}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);font-weight:600}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}

/* Shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand-mark{width:28px;height:28px;border-radius:var(--r-md);background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-family:var(--f-display);font-weight:700;font-size:14px}
.brand b{font-family:var(--f-display);font-size:15px;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--fg-3)}
.search-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--sunk);border-radius:var(--r-md);color:var(--fg-3);text-align:left}
.search-btn kbd{margin-left:auto}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--fg-2);background:var(--surface)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);font-weight:600;padding:10px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--fg-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-2);color:var(--accent)}
.nav svg{width:16px;height:16px;flex:none}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--fg-3)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px}
.role-label{font-size:11px;color:var(--fg-3)}
.select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.crumb{font-size:13px;color:var(--fg-3)} .crumb b{color:var(--fg);font-weight:600}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--fg-2);background:var(--surface);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.content{padding-block:24px 64px;padding-inline:24px;max-width:1320px;width:100%;display:flex;flex-direction:column;gap:20px}

/* Components */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h .spacer{flex:1}
.panel-b{padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;min-height:34px;border-radius:var(--r-btn);border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-crit{background:var(--crit-bg);color:var(--crit)} .p-info{background:var(--accent-2);color:var(--accent)} .p-mute{background:var(--sunk);color:var(--fg-2)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td.r,th.r{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent-2);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)} .bar.crit i{background:var(--crit)}

/* Home */
.hello{display:flex;flex-direction:column;gap:14px;padding:28px 0 8px;align-items:flex-start}
.ask{display:flex;align-items:center;gap:12px;width:100%;max-width:720px;padding:14px 16px;border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--surface);color:var(--fg-3);text-align:left;font-size:15px;box-shadow:0 1px 0 var(--line)}
.ask .joe{color:var(--accent);font-weight:600}
.ask kbd{margin-left:auto}
.sugs{display:flex;flex-wrap:wrap;gap:8px}
.sug{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2)}
.sug:hover{border-color:var(--accent);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px}
.up{color:var(--ok)} .down-bad{color:var(--crit)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
.todo{display:flex;flex-direction:column}
.todo button{display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.todo button:last-child{border-bottom:0}
.todo button:hover{background:var(--sunk)}
.todo .n{font-family:var(--f-mono);font-size:13px;min-width:44px;text-align:right;color:var(--fg)}
.todo .t{flex:1;min-width:0}
.todo .t small{display:block;color:var(--fg-3);font-size:12px}
.sev{width:3px;align-self:stretch;border-radius:2px;background:var(--line-2)}
.sev.crit{background:var(--crit)} .sev.warn{background:var(--warn)} .sev.ok{background:var(--ok)} .sev.info{background:var(--accent)}
.joe-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.joe-h{display:flex;align-items:center;gap:8px;font-weight:600;font-family:var(--f-display)}
.joe-badge{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:12px}
.insight{padding:10px 12px;border-radius:var(--r-md);background:var(--sunk);font-size:13px;display:flex;flex-direction:column;gap:6px}
.insight .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.feed{display:flex;flex-direction:column}
.feed div{display:flex;gap:10px;padding:9px 16px;font-size:13px;border-bottom:1px solid var(--line)}
.feed div:last-child{border-bottom:0}
.feed time{font-family:var(--f-mono);font-size:12px;color:var(--fg-3);min-width:40px}

/* Tiers payant */
.tp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.idcard{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--sunk)}
.photo{width:56px;height:56px;border-radius:var(--r-md);background:var(--accent-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;color:var(--accent);font-size:18px;flex:none}
.checks{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 2px;font-size:13px}
.check .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;margin-top:1px;background:var(--ok-bg);color:var(--ok)}
.check .ic.w{background:var(--warn-bg);color:var(--warn)}
.check code{font-family:var(--f-mono);font-size:11px;color:var(--fg-3);margin-left:auto;white-space:nowrap}
.acts td{padding:9px 10px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.split div{padding:12px;border-radius:var(--r-md);border:1px solid var(--line)}
.split .v{font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.split .mc{background:var(--accent-2);border-color:transparent}
.split .mc .v{color:var(--accent)}
.decision{margin-top:14px;padding:14px;border-radius:var(--r-md);display:flex;flex-direction:column;gap:8px}
.decision.auto{background:var(--ok-bg)} .decision.review{background:var(--warn-bg)}
.decision b{font-family:var(--f-display);font-size:15px}
.decision.auto b{color:var(--ok)} .decision.review b{color:var(--warn)}
.rule{font-family:var(--f-mono);font-size:12px;color:var(--fg-2);line-height:1.7;white-space:pre-wrap}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.add-act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* Filters */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(15,18,40,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 16px;border-bottom:1px solid var(--line)}
.drawer-b{padding:18px 20px calc(40px + env(safe-area-inset-bottom,0px));overflow:auto;display:flex;flex-direction:column;gap:18px}
.props{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 14px;font-size:13px}
.props dt{color:var(--fg-3)} .props dd{margin:0;min-width:0}
.secret{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-md);border:1px dashed var(--line-2);color:var(--fg-3);font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 10px;color:var(--fg-3);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.fam{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fam div{padding:10px;border:1px solid var(--line);border-radius:var(--r-md);font-size:13px}
.garantie{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:6px 14px;align-items:center;font-size:13px}

/* Ledger */
.ledger td{font-size:12.5px}
.ledger .acct{font-family:var(--f-mono);font-size:12px}
.ledger tr.first td{border-top:1px solid var(--line-2)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r-md);background:var(--accent-2);color:var(--accent);font-size:13px}

/* Produits */
.versions{display:flex;gap:10px;flex-wrap:wrap}
.ver{flex:1;min-width:180px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px}
.ver[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.diff-up{color:var(--ok);font-family:var(--f-mono);font-size:12px}
.diff-dn{color:var(--crit);font-family:var(--f-mono);font-size:12px}

/* Porteurs */
.cards-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.org{padding:16px;display:flex;flex-direction:column;gap:10px}
.org .roles{display:flex;gap:6px;flex-wrap:wrap}
.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:600} .no{color:var(--fg-3)}

/* Palette */
.pal-scrim{position:fixed;inset:0;background:rgba(15,18,40,.4);z-index:30;display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px}
.pal{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:75vh}
.pal input{border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:transparent;outline:none;width:100%}
.pal-list{overflow:auto;padding:6px}
.pal-sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);font-weight:600;padding:10px 12px 4px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;background:none;border-radius:var(--r-md);text-align:left}
.pal-item[aria-selected="true"]{background:var(--accent-2)}
.pal-item small{margin-left:auto;color:var(--fg-3);font-family:var(--f-mono);font-size:11px}
.pal-answer{padding:14px 18px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);background:var(--sunk)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r-md);font-size:13px;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* Responsive */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.cards-3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav-group{display:none}
  .nav a{white-space:nowrap}
  .side-foot{flex-direction:row;flex-wrap:wrap;align-items:center;margin-top:0}
  .side-foot > .select,.side-foot > .theme-row{flex:1 1 200px;min-width:0}
  .side-foot .role-label{display:none}
  .topbar{padding:10px 16px}
  .content{padding-inline:16px}

/* ---------- Comptoir mobile ---------- */
const mob = {step:0, otp:'', acts:new Set([0,1,2]), sun:false, offline:false, issued:null, mcInput:''};
const OTP_DEMO = '482913';
function vMobile(){
  const m = members[1];
  const steps = ['Carte','Identité','Code','Actes','Décision'];
  const sel = [...mob.acts].sort((a,b)=>a-b).map(i=>bareme[i]);
  const total = sel.reduce((a,x)=>a+x[1],0), share = Math.round(total*m.rate/100), auto = total>0 && total<50000;
  const pct = mob.issued ? 100 : Math.round(mob.step/steps.length*100);
  let body='', foot='';

      <p class="mono" style="margin:0">${mob.issued.id}</p>
      ${mob.issued.auto?`<div class="m-cash">Encaisser auprès du patient<b>${F(mob.issued.total-mob.issued.share)}</b></div>`:`<p style="margin:0">Réponse attendue en moins de 2 heures. Le patient peut patienter ou revenir.</p>`}
      ${mob.offline&&mob.issued.auto?`<p style="margin:0">Signé sur cet appareil, valable 2 heures. Il sera synchronisé dès le retour du réseau.</p>`:`<p style="margin:0">SMS de confirmation envoyé à ${m.name}.</p>`}</div>`;
    foot = `<button class="m-btn" data-m="next-patient">Patient suivant</button>`;
  } else if(mob.step===0){
    body = `<span class="m-step">Étape 1 sur 5</span><h2>Scannez la carte de l'adhérent</h2>
      <button class="m-scan" data-m="scan" aria-label="Scanner la carte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="3" height="3"/><rect x="13" y="8" width="3" height="3"/><rect x="8" y="13" width="3" height="3"/><path d="M13 13h3v3"/></svg></button>
      <div class="m-field"><label for="m-num">Ou saisissez le numéro MulemaCare</label><input class="m-input mono" id="m-num" placeholder="MC-00928194" value="${esc(mob.mcInput)}" autocomplete="off"></div>`;
    foot = `<button class="m-btn" data-m="scan">Scanner la carte</button><button class="m-btn sec" data-m="lookup">Rechercher le numéro</button>`;
  } else if(mob.step===1){
    body = `<span class="m-step">Étape 2 sur 5</span><h2>La personne en face de vous est-elle bien celle-ci ?</h2>
      <div class="m-id"><div class="photo">${initials(m.name)}</div><b style="font-size:20px">${m.name}</b><span class="mono">${m.id}</span><span>${m.plan} · ${m.rate} %</span><span class="pill p-ok">Droits ouverts</span></div>`;
    foot = `<button class="m-btn" data-m="id-yes">Oui, c'est elle</button><button class="m-btn bad" data-m="id-no">Non, ce n'est pas elle</button>`;
  } else if(mob.step===2){
    body = `<span class="m-step">Étape 3 sur 5</span><h2>Demandez le code reçu par SMS</h2>
      <p style="margin:0">Un code à 6 chiffres vient d'être envoyé au téléphone de ${m.name}. Il confirme qu'elle est présente.</p>
      <div class="m-field"><label for="m-otp">Code à 6 chiffres</label><input class="m-input m-otp" id="m-otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" value="${esc(mob.otp)}"></div>
      <p class="mono" style="margin:0;font-size:14px">Démo : ${OTP_DEMO.slice(0,3)} ${OTP_DEMO.slice(3)}</p>`;
    foot = `<button class="m-btn" data-m="otp" ${mob.otp.length===6?'':'disabled'}>Valider le code</button><button class="m-btn sec" data-m="resend">Renvoyer le code</button>`;
  } else if(mob.step===3){
    body = `<span class="m-step">Étape 4 sur 5</span><h2>Quels actes aujourd'hui ?</h2>
      <div class="m-acts" role="group" aria-label="Actes">${bareme.map((b,i)=>`<button class="m-act" role="checkbox" aria-checked="${mob.acts.has(i)}" data-act="${i}"><span class="m-box" aria-hidden="true">${mob.acts.has(i)?'✓':''}</span><span>${b[0]}</span><span class="num">${fmt(b[1])}</span></button>`).join('')}</div>
      <div class="m-total"><span>Total au barème</span><b>${F(total)}</b></div>`;
    foot = `<button class="m-btn" data-m="to-decision" ${total?'':'disabled'}>Calculer la prise en charge</button>`;
  } else {
    body = `<span class="m-step">Étape 5 sur 5</span><h2>Prise en charge</h2>
      <div class="m-split"><div class="mc"><span>MulemaCare paie</span><span class="big">${F(share)}</span></div><div><span>Le patient paie</span><span class="big">${F(total-share)}</span></div></div>
      <div class="m-verdict ${auto?'auto':'review'}"><b>${auto?(mob.offline?'Accord provisoire possible':'Accord immédiat'):'Avis du médecin-conseil requis'}</b>
      <span>${auto?(mob.offline?'Réseau coupé : l\'accord est signé sur cet appareil et reste valable 2 heures.':'Toutes les conditions de la règle R-12 sont remplies.'):mob.offline?'Réseau coupé : le dossier partira dès le retour du réseau.':`Le total dépasse 50 000 FCFA. Réponse en moins de 2 heures.`}</span></div>`;
    foot = `<button class="m-btn" data-m="issue">${auto?'Émettre l\'accord':'Envoyer au médecin-conseil'}</button><button class="m-btn sec" data-m="back">Modifier les actes</button>`;
  }
  $('#view').innerHTML = `
  <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Portail prestataire · téléphone Android du comptoir</span><h1>Comptoir mobile</h1><p class="muted" style="margin:0;max-width:65ch">Le même tiers payant, pensé pour un téléphone d'entrée de gamme, une connexion instable et une file d'attente. Une seule décision par écran.</p></div>
  <div class="mob-wrap">
    <div class="phone"><div class="m-app ${mob.sun?'sun':''}">
      <div class="m-bar"><span class="brand-mark" style="width:32px;height:32px">M</span><div style="min-width:0"><b>Clinique Les Palmiers</b><div style="font-size:13px">Comptoir 2 · Aya</div></div></div>
      <div class="m-prog" aria-hidden="true"><i style="width:${pct}%"></i></div>
      ${mob.offline?`<div class="m-net" role="status">Hors ligne · les accords sous 50 000 FCFA restent possibles</div>`:''}
      <div class="m-body">${body}</div>
      <div class="m-foot">${foot}</div>
    </div></div>
    <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
      <div class="panel"><div class="panel-h"><h2>Conditions du terrain</h2></div><div class="panel-b" style="padding-block:4px">
        <div class="toggle"><div><b style="font-weight:600">Mode plein soleil</b><div class="muted" style="font-size:13px">Noir sur blanc, traits épais, quel que soit le thème</div></div><button class="switch" role="switch" aria-checked="${mob.sun}" data-sw="sun" aria-label="Mode plein soleil"></button></div>
        <div class="toggle"><div><b style="font-weight:600">Simuler une coupure réseau</b><div class="muted" style="font-size:13px">Accord provisoire signé sur l'appareil, synchronisé ensuite</div></div><button class="switch" role="switch" aria-checked="${mob.offline}" data-sw="offline" aria-label="Simuler une coupure réseau"></button></div>
      </div></div>
      <div class="panel"><div class="panel-h"><h2>Règles appliquées</h2></div><div class="panel-b rules">
        <div class="rule-item"><span class="k">48 px</span><span>Toute zone tactile fait au moins 48 px de haut ; les actions principales 56 px, en bas de l'écran, sous le pouce.</span></div>
        <div class="rule-item"><span class="k">16 px</span><span>Texte courant à 16 px minimum, montants à 24 px et plus. Aucun texte secondaire en gris clair.</span></div>
        <div class="rule-item"><span class="k">4,5 : 1</span><span>Contraste minimum AA partout ; le mode plein soleil dépasse 15 : 1.</span></div>
        <div class="rule-item"><span class="k">1 écran</span><span>Une question par écran, formulée comme on la dit au comptoir : « Est-ce bien elle ? »</span></div>
        <div class="rule-item"><span class="k">hors ligne</span><span>Les accords sous le seuil automatique se signent sur l'appareil et se synchronisent au retour du réseau.</span></div>
        <div class="rule-item"><span class="k">clavier</span><span>Le code s'ouvre sur le pavé numérique et se remplit depuis le SMS quand le téléphone le permet.</span></div>
      </div></div>
    </div>
  </div>`;
  const root = $('#view');
  root.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{mob[b.dataset.sw]=!mob[b.dataset.sw];vMobile();});
  root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const i=+b.dataset.act;mob.acts.has(i)?mob.acts.delete(i):mob.acts.add(i);vMobile();});
  const num = $('#m-num'); if(num) num.oninput=()=>{mob.mcInput=num.value;};
  const otp = $('#m-otp'); if(otp){ otp.oninput=()=>{ otp.value=otp.value.replace(/\D/g,'').slice(0,6); mob.otp=otp.value; const b=root.querySelector('[data-m="otp"]'); if(b) b.disabled = mob.otp.length!==6; }; otp.focus(); }
  root.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const a = b.dataset.m;
    if(a==='scan'){ mob.step=1; }
    else if(a==='lookup'){ const v=(mob.mcInput||'').trim().toUpperCase(); if(v && v!==m.id){ toast(`Aucun adhérent trouvé pour ${v}. Vérifiez le numéro sur la carte.`); return; } mob.step=1; }
    else if(a==='id-yes'){ mob.step=2; mob.otp=''; }
    else if(a==='id-no'){ toast('Prise en charge bloquée. Le signalement est transmis à la mutuelle.'); feed.unshift(['20:48','Comptoir mobile : identité refusée pour MC-00928194 (Clinique Les Palmiers)']); mob.step=0; }
    else if(a==='resend'){ toast('Nouveau code envoyé par SMS.'); }
    else if(a==='otp'){ if(mob.otp!==OTP_DEMO){ toast('Code incorrect. Demandez à l\'adhérente de le relire, ou renvoyez-le.'); return; } mob.step=3; }
    else if(a==='to-decision'){ mob.step=4; }
    else if(a==='back'){ mob.step=3; }
    else if(a==='issue'){
      const id = 'PEC-26-0' + (9815 + claims.length);
      claims.unshift({id, m:1, prov:0, date:'30/09 20:48', total, share, status:auto?'auto':'review', fraud:.06, acts:sel.map(x=>x[0]), dx:'Consultation — comptoir mobile', rule:auto?'R-12 v3':'R-20 v2'});
      if(auto) ledger.unshift({id:'J-2026-09184'+(10+ledger.length), t:'30/09 20:48', lib:`${id} · accord comptoir mobile${mob.offline?' (provisoire, hors ligne)':''}`, lines:[['6011','Prestations santé — soins',share,0],['4011','Prestataires à payer · Clinique Les Palmiers',0,share]]});
      feed.unshift(['20:48',`${id} ${auto?'accordée':'envoyée au médecin-conseil'} depuis le comptoir mobile — Awa Koné`]);
      mob.issued = {id, total, share, auto}; renderNav();
    }
    else if(a==='next-patient'){ mob.step=0; mob.otp=''; mob.issued=null; mob.acts=new Set([0,1,2]); mob.mcInput=''; }
    vMobile();
  });
}

/* ---------- Prises en charge ---------- */
function vClaims(){
  let list = role==='clin' ? claims.filter(c=>c.prov===0) : claims;
  if(claimFilter!=='all') list = list.filter(c=>c.status===claimFilter);
  const fb = (k,l) => `<button data-f="${k}" aria-pressed="${claimFilter===k}">${l}</button>`;
  $('#view').innerHTML = `
  <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">${role==='clin'?'Clinique Les Palmiers · vos dossiers':'Toutes les prises en charge'}</span><h1>Prises en charge</h1></div>
  <div class="filters">${fb('all','Toutes')}${fb('review','Revue médecin-conseil')}${fb('fraud','Alertes fraude')}${fb('auto','Automatiques')}${fb('paid','Payées')}${fb('rejected','Refusées')}</div>
  <div class="panel tbl-wrap"><table><thead><tr><th>Dossier</th><th>Adhérent</th><th>Prestataire</th><th class="r">Montant</th><th class="r">Part mutuelle</th><th>Risque</th><th>Statut</th></tr></thead><tbody>
    ${list.length? list.map(c=>{const m=members[c.m];const s=statusMap[c.status];const fc=c.fraud>.6?'crit':c.fraud>.15?'warn':'ok';
      return `<tr class="click" data-claim="${c.id}" tabindex="0"><td><div class="mono" style="font-size:12px">${c.id}</div><div class="faint" style="font-size:12px">${c.date}</div></td><td><div class="who"><span class="av">${initials(m.name)}</span>${m.name}</div></td><td class="muted">${providers[c.prov]}</td><td class="r num">${fmt(c.total)}</td><td class="r num">${fmt(c.share)}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar ${fc}" style="width:60px"><i style="width:${Math.max(6,c.fraud*100)}%"></i></div><span class="num faint" style="font-size:12px">${c.fraud.toFixed(2).replace('.',',')}</span></div></td><td><span class="pill ${s[1]}">${s[0]}</span></td></tr>`}).join('')
      : `<tr><td colspan="7" class="faint" style="padding:28px;text-align:center">Aucune prise en charge dans ce filtre.</td></tr>`}
  </tbody></table></div>`;
  $('#view').querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{claimFilter=b.dataset.f;vClaims();});
  $('#view').querySelectorAll('[data-claim]').forEach(r=>{r.onclick=()=>openClaim(r.dataset.claim);r.onkeydown=e=>{if(e.key==='Enter')openClaim(r.dataset.claim);};});
}
function openClaim(id){
  const c = claims.find(x=>x.id===id); const m = members[c.m]; const s = statusMap[c.status];
  const canDecide = (c.status==='review'||c.status==='fraud'||c.status==='info') && role!=='clin';
  const dxBlock = role==='mc'
    ? `<div><span class="eyebrow">Motif médical</span><p style="margin:6px 0 0">${esc(c.dx)}</p><p class="faint" style="font-size:12px;margin:4px 0 0">Accès médecin-conseil journalisé · ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</p></div>`
    : `<div class="secret">🔒 Motif médical masqué — visible uniquement par le médecin-conseil (secret médical).</div>`;
  openDrawer(`
    <div class="drawer-h"><div style="flex:1;min-width:0"><div class="mono faint" style="font-size:12px">${c.id} · ${c.date}</div><h2 style="font-size:20px;margin-top:4px">${F(c.total)}</h2><div style="margin-top:6px"><span class="pill ${s[1]}">${s[0]}</span></div></div><button class="btn ghost" data-close aria-label="Fermer">✕</button></div>
    <div class="drawer-b">
      <dl class="props">
        <dt>Adhérent</dt><dd>${m.name} <span class="mono faint" style="font-size:12px">${m.id}</span></dd>
        <dt>Prestataire</dt><dd>${providers[c.prov]}</dd>
        <dt>Actes</dt><dd>${c.acts.map(esc).join(' · ')}</dd>
        <dt>Part mutuelle</dt><dd class="num">${F(c.share)} <span class="faint">(${m.rate} %)</span></dd>
        <dt>Règle appliquée</dt><dd class="mono" style="font-size:12px">${c.rule}</dd>
      </dl>
      ${dxBlock}
      ${c.flag?`<div class="insight" style="background:var(--crit-bg);color:var(--crit)"><b>Signal</b>${esc(c.flag)}</div>`:''}
      <div class="joe-card" style="padding:14px">
        <div class="joe-h"><span class="joe-badge">✦</span>Analyse JOE</div>
        <div style="font-size:13px" class="muted">${c.status==='fraud'
          ? `Même bénéficiaire, même laboratoire : 4 bilans complets depuis le 18 août. Les 3 précédents n'ont donné lieu à aucune consultation de suivi. Recommandation : demander l'ordonnance originale avant paiement.`
          : c.status==='review'
          ? `Acte cohérent avec l'historique récent de l'adhérente. Tarif conforme au barème conventionné. Recommandation : accorder, sous réserve de validation médicale.`
          : `Dossier conforme. Aucune anomalie de tarif ni de fréquence.`}</div>
        <div class="faint" style="font-size:12px">JOE recommande ; la décision reste humaine ou issue d'une règle versionnée.</div>
      </div>
      ${canDecide?`<div class="row-actions"><button class="btn primary" data-dec="approved">Accorder</button><button class="btn" data-dec="info">Demander des pièces</button><button class="btn danger" data-dec="rejected">Refuser</button></div>`:''}
    </div>`);
  $('#drawer-root').querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{
    const d = b.dataset.dec; c.status = d;
    if(d==='approved'){ ledger.unshift({id:'J-2026-09184'+(10+ledger.length), t:'30/09 20:34', lib:`${c.id} · accord après revue`, lines:[['6011','Prestations santé — soins',c.share,0],['4011','Prestataires à payer · '+providers[c.prov],0,c.share]]}); }
    if(d==='rejected') c.share = 0;
    feed.unshift(['20:34',`${c.id} : ${statusMap[d][0].toLowerCase()} par ${role==='mc'?'le médecin-conseil':'le gestionnaire'}`]);
    closeDrawer(); renderNav(); vClaims();
    toast({approved:`${c.id} accordée. Écriture passée au grand livre.`, info:`Demande de pièces envoyée à ${providers[c.prov]}.`, rejected:`${c.id} refusée. Le prestataire et l'adhérent sont notifiés.`}[d]);
  });
}

/* ---------- Adhérents ---------- */
function vMembers(){
  $('#view').innerHTML = `
  <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">48 290 adhérents actifs · 6 affichés</span><h1>Adhérents</h1></div>

let palSel = 0, palItems = [];
function openPal(q=''){
  $('#pal-root').innerHTML = `<div class="pal-scrim" id="pal-scrim"><div class="pal" role="dialog" aria-modal="true" aria-label="Recherche et JOE"><input id="pal-in" placeholder="Adhérent, dossier, prestataire… ou une question pour JOE" autocomplete="off"><div class="pal-list" id="pal-list"></div><div id="pal-ans"></div></div></div>`;
  const inp = $('#pal-in'); inp.value = q; inp.focus();
  $('#pal-scrim').onclick = e => { if(e.target.id==='pal-scrim') closePal(); };
  inp.oninput = () => renderPal(inp.value);
  inp.onkeydown = e => {
    if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,palItems.length-1);renderPal(inp.value,true);}
    else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);renderPal(inp.value,true);}
    else if(e.key==='Enter'){e.preventDefault(); if(palItems[palSel]) palItems[palSel].run(); else if(inp.value.trim()) askJoe(inp.value.trim());}
  };
  renderPal(q);
  if(answers[q]) askJoe(q);
}
function closePal(){ $('#pal-root').innerHTML=''; }
function renderPal(q, keep){
  if(!keep) palSel = 0;
  const s = q.toLowerCase().trim();
  const items = [];
  Object.keys(answers).filter(a=>!s||a.toLowerCase().includes(s)).slice(0,4).forEach(a=>items.push({sec:'Demander à JOE',label:'✦ '+a,run:()=>askJoe(a)}));
  if(s && !Object.keys(answers).some(a=>a.toLowerCase()===s)) items.unshift({sec:'Demander à JOE',label:'✦ '+q,run:()=>askJoe(q)});
  members.filter(m=>!s||m.name.toLowerCase().includes(s)||m.id.toLowerCase().includes(s)).slice(0,4).forEach(m=>items.push({sec:'Adhérents',label:m.name,meta:m.id,run:()=>{closePal(); if(role!=='gest'){toast('Fiche adhérent réservée au gestionnaire.');return;} go('members'); openMember(members.indexOf(m));}}));
  claims.filter(c=>!s||c.id.toLowerCase().includes(s)||providers[c.prov].toLowerCase().includes(s)).slice(0,3).forEach(c=>items.push({sec:'Prises en charge',label:providers[c.prov],meta:c.id,run:()=>{closePal(); go('claims'); openClaim(c.id);}}));
  nav.filter(n=>n.k&&n.roles.includes(role)&&(!s||n.l.toLowerCase().includes(s))).forEach(n=>items.push({sec:'Aller à',label:n.l,run:()=>{closePal();go(n.k);}}));
  palItems = items;
  let html='', last='';
  items.forEach((it,i)=>{ if(it.sec!==last){html+=`<div class="pal-sec">${it.sec}</div>`;last=it.sec;} html+=`<button class="pal-item" data-i="${i}" aria-selected="${i===palSel}">${esc(it.label)}${it.meta?`<small>${it.meta}</small>`:''}</button>`; });
  $('#pal-list').innerHTML = html || '<div class="pal-sec">Aucun résultat</div>';
  $('#pal-list').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>items[+b.dataset.i].run());
}
function askJoe(q){
  let a = answers[q]; if(typeof a==='function') a = a();

  $('#pal-ans').innerHTML = `<div class="pal-answer"><div class="joe-h"><span class="joe-badge">✦</span>${esc(q)}</div><div style="font-size:14px">${a}</div><div class="faint" style="font-size:12px">Chiffres de démonstration · source : grand livre et prises en charge de septembre.</div></div>`;
}

  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode===mode)));
  renderThemeMenu(skin);
  try{ localStorage.setItem('mc-skin', skin); localStorage.setItem('mc-mode', mode); }catch(e){}
  if(announce) toast(`Thème appliqué : ${skinNames[skin]}.`);
}
let savedSkin='mulema', savedMode='auto';
try{ savedSkin = localStorage.getItem('mc-skin') || 'mulema'; savedMode = localStorage.getItem('mc-mode') || 'auto'; }catch(e){}
if(!skinNames[savedSkin]) savedSkin='mulema';
if(!['auto','light','dark'].includes(savedMode)) savedMode='auto';
applySkin(savedSkin, savedMode, false);
$('#skin').addEventListener('change', e => applySkin(e.target.value, $('#mode').value, true));
$('#mode').addEventListener('change', e => applySkin($('#skin').value, e.target.value, false));
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => applySkin($('#skin').value, b.dataset.mode, false)));
function setMenu(open){ $('#tmenu').hidden = !open; $('#theme-btn').setAttribute('aria-expanded', String(open)); }
$('#theme-btn').addEventListener('click', e => { e.stopPropagation(); setMenu($('#tmenu').hidden); });
$('#tmenu').addEventListener('click', e => { const b = e.target.closest('[data-skin-pick]'); if(!b) return; applySkin(b.dataset.skinPick, $('#mode').value, true); setMenu(false); });
document.addEventListener('click', e => { if(!e.target.closest('.tmenu-wrap')) setMenu(false); });
document.addEventListener('keydown', e => { if(e.key==='Escape') setMenu(false); });

const h = (location.hash||'').slice(1);
go(titles[h] ? h : 'home');
})();
</script>
